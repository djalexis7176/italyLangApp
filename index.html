let sheetStep = 0;
function P_(k){ return (S.profile||{})[k]; }
function setP(k,v){ S.profile = S.profile || {}; S.profile[k] = v; save(); }

function renderSheet(){
  const st = SHEET[sheetStep];
  const done = Math.round(sheetStep / SHEET.length * 100);
  view.innerHTML = `
    <div class="row" style="align-items:center;margin:14px 0 4px">
      <div class="grow"><h1 style="margin:0;font-size:25px">${esc(st.t)}</h1>
        <div class="small">Step ${sheetStep+1} of ${SHEET.length} · ${esc(st.b)}</div></div>
      <button class="btn quiet" id="closeSheetForm">Close</button>
    </div>
    <div class="bar"><i style="width:${done}%"></i></div>
    <p class="hint">Skip anything you'd rather not answer. Your answers never leave this device.</p>
    <div id="qs">${st.q.map(q=>qHTML(q)).join("")}</div>
    <div class="row" style="gap:8px;margin-top:14px">
      <button class="btn ghost" id="prevStep" ${sheetStep?"":"disabled"}>Back</button>
      <button class="btn grow" id="nextStep">${sheetStep===SHEET.length-1?"Build my phrases":"Next"}</button>
    </div>`;
  wireSheet(st);
  $("#closeSheetForm").onclick = ()=>{ S.sheetOpen = false; save(); renderSaved(); };
  $("#prevStep").onclick = ()=>{ sheetStep--; window.scrollTo(0,0); renderSheet(); };
  $("#nextStep").onclick = ()=>{
    if(sheetStep === SHEET.length-1){
      S.profileDone = true; S.sheetOpen = false; save();
      profileView = "cards"; renderSaved(); toast("Your phrases are ready");
    } else { sheetStep++; window.scrollTo(0,0); renderSheet(); }
  };
}
function qHTML(q){
  const v = P_(q.k);
  const head = `<div style="font-weight:600;font-size:15px">${esc(q.q)}</div>
    ${q.hint?`<p class="small" style="margin:3px 0 6px">${esc(q.hint)}</p>`:`<div style="height:6px"></div>`}`;
  if(q.type === "text" || q.type === "number")
    return `<div class="card tight">${head}
      <input class="answer" data-k="${q.k}" type="${q.type==="number"?"number":"text"}"
        inputmode="${q.type==="number"?"numeric":"text"}" placeholder="${esc(q.ph||"")}" value="${esc(v||"")}"></div>`;
  if(q.type === "date")
    return `<div class="card tight">${head}
      <input class="answer" data-k="${q.k}" type="date" value="${esc(v||"")}"></div>`;
  if(q.type === "select")
    return `<div class="card tight">${head}
      <div class="chips">${q.o.map(([val,lab])=>
        `<button class="chip" data-sel="${q.k}" data-v="${esc(val)}" aria-pressed="${v===val}">${esc(lab)}</button>`).join("")}</div></div>`;
  if(q.type === "multi"){
    const set = Array.isArray(v) ? v : [];
    return `<div class="card tight">${head}
      <div class="chips">${q.o.map(([val,lab])=>
        `<button class="chip" data-multi="${q.k}" data-v="${esc(val)}" aria-pressed="${set.includes(val)}">${esc(lab)}</button>`).join("")}</div></div>`;
  }
  if(q.type === "list5"){
    const arr = Array.isArray(v) ? v : [];
    return `<div class="card tight">${head}
      ${[0,1,2,3,4].map(i=>`<input class="answer" style="margin-bottom:6px" data-list="${q.k}" data-i="${i}"
        placeholder="${i===0?esc(q.ph||""):""}" value="${esc(arr[i]||"")}">`).join("")}</div>`;
  }
  if(q.type === "people"){
    const arr = Array.isArray(v) ? v : [];
    return `<div class="card tight">${head}
      <div id="people_${q.k}">${arr.map((p,i)=>peopleRow(q.k,i,p)).join("")}</div>
      <button class="btn quiet wide" data-addp="${q.k}" style="margin-top:6px">Add a person</button></div>`;
  }
  return "";
}
function peopleRow(k,i,p){
  return `<div class="row" style="gap:6px;margin-bottom:6px" data-prow="${k}:${i}">
    <select class="answer" style="flex:1.1;padding:10px" data-pk="${k}" data-i="${i}" data-f="rel">
      ${RELAZIONI.map(r=>`<option value="${r[0]}" ${p.rel===r[0]?"selected":""}>${esc(r[2])}</option>`).join("")}
    </select>
    <input class="answer" style="flex:1.2" data-pk="${k}" data-i="${i}" data-f="name" placeholder="name" value="${esc(p.name||"")}">
    <input class="answer" style="flex:.55" data-pk="${k}" data-i="${i}" data-f="age" inputmode="numeric" placeholder="age" value="${esc(p.age||"")}">
    <button class="btn quiet" data-delp="${k}:${i}" style="padding:8px 10px">✕</button>
  </div>`;
}
function wireSheet(st){
  view.querySelectorAll("[data-k]").forEach(el => el.oninput = ()=> setP(el.dataset.k, el.value.trim()));
  view.querySelectorAll("[data-sel]").forEach(b => b.onclick = ()=>{
    const k = b.dataset.sel;
    setP(k, P_(k) === b.dataset.v ? "" : b.dataset.v);
    renderSheet();
  });
  view.querySelectorAll("[data-multi]").forEach(b => b.onclick = ()=>{
    const k = b.dataset.multi, v = b.dataset.v;
    const set = Array.isArray(P_(k)) ? P_(k).slice() : [];
    const ix = set.indexOf(v);
    if(ix >= 0) set.splice(ix,1); else set.push(v);
    setP(k, set);
    b.setAttribute("aria-pressed", String(ix < 0));
  });
  view.querySelectorAll("[data-list]").forEach(el => el.oninput = ()=>{
    const k = el.dataset.list;
    const arr = Array.isArray(P_(k)) ? P_(k).slice() : [];
    arr[+el.dataset.i] = el.value.trim();
    setP(k, arr);
  });
  view.querySelectorAll("[data-addp]").forEach(b => b.onclick = ()=>{
    const k = b.dataset.addp;
    const arr = Array.isArray(P_(k)) ? P_(k).slice() : [];
    arr.push({rel:"figlio", name:"", age:""});
    setP(k, arr); renderSheet();
  });
  view.querySelectorAll("[data-delp]").forEach(b => b.onclick = ()=>{
    const [k,i] = b.dataset.delp.split(":");
    const arr = P_(k).slice(); arr.splice(+i,1); setP(k,arr); renderSheet();
  });
  view.querySelectorAll("[data-pk]").forEach(el => {
    const upd = ()=>{
      const k = el.dataset.pk, arr = P_(k).slice();
      arr[+el.dataset.i] = Object.assign({}, arr[+el.dataset.i], {[el.dataset.f]: el.value.trim()});
      setP(k, arr);
    };
    el.oninput = upd; el.onchange = upd;
  });
}

/* ============================================================
   Turning the sheet into phrases
   ============================================================ */
function relOf(code){ return RELAZIONI.find(r=>r[0]===code) || RELAZIONI[0]; }
const MESI_EN = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function dateIt(d){
  if(!d) return null;
  const [y,m,day] = d.split("-").map(Number);
  if(!y) return null;
  return {it: (day===1?"il primo":"il "+day) + " " + MESI[m-1], en: MESI_EN[m-1] + " " + day};
}
/* a, b and c */
function joinIt(a){ return a.length<2 ? (a[0]||"") : a.slice(0,-1).join(", ") + " e " + a[a.length-1]; }
function joinEn(a){ return a.length<2 ? (a[0]||"") : a.slice(0,-1).join(", ") + " and " + a[a.length-1]; }
/* formal (lei) and informal (tu) versions of the questions people ask you */
const ASK = {
 nome:   [["Come si chiama?","Come ti chiami?"], "What's your name?"],
 dove:   [["Di dov'è?","Di dove sei?"], "Where are you from?"],
 lavoro: [["Che lavoro fa?","Che lavoro fai?"], "What do you do?"],
 quanto: [["Quanto si ferma?","Quanto ti fermi?"], "How long are you staying?"],
 prima:  [["È la prima volta in Italia?","È la prima volta che vieni in Italia?"], "Is this your first time in Italy?"],
 porta:  [["Che cosa la porta in Italia?","Che cosa ti porta in Italia?"], "What brings you to Italy?"],
 sposato:[["È sposato?","Sei sposato?"], "Are you married?"],
 figli:  [["Ha figli?","Hai figli?"], "Do you have children?"],
 piace:  [["Che cosa le piace fare?","Che cosa ti piace fare?"], "What do you like doing?"],
 musica: [["Che musica ascolta?","Che musica ascolti?"], "What music do you listen to?"],
 mangia: [["Mangia di tutto?","Mangi di tutto?"], "Do you eat everything?"],
 beve:   [["Che cosa beve?","Che cosa bevi?"], "What would you like to drink?"],
 dove_va:[["Dove va dopo?","Dove vai dopo?"], "Where are you going next?"],
 arrivato:[["Quando è arrivato?","Quando sei arrivato?"], "When did you arrive?"],
 parla:  [["Parla italiano?","Parli italiano?"], "Do you speak Italian?"],
 sposi:  [["Come conosce gli sposi?","Come conosci gli sposi?"], "How do you know the couple?"],
 telefono:[["Mi dà un numero di telefono?","Mi dai un numero?"], "Can you give me a phone number?"]
};
function askQ(key, reg){ const a = ASK[key]; return a ? {it:a[0][reg==="tu"?1:0], en:a[1]} : null; }

function buildProfile(){
  const p = S.profile || {};
  const reg = S.profileReg || "lei";
  const f = p.gen === "f";
  const G = (m, fm) => f ? fm : m;
  const out = [];
  const sec = (t, b) => { out.push({t, b, c:[]}); return out[out.length-1]; };
  const add = (s, a_it, a_en, qk) => {
    if(!a_it) return;
    const q = qk ? askQ(qk, reg) : null;
    s.c.push({id: norm(a_en).replace(/[^a-z ]/g,"").slice(0,28), q, a:[a_it, a_en]});
  };
  const nome = p.nome || "";
  const naz = NAZ.find(n=>n[0]===p.paese);

  /* ---- who you are ---- */
  const s1 = sec("Chi sono", "Your name, where you're from, how much Italian you have.");
  if(nome) add(s1, `Mi chiamo ${nome}.`, `My name is ${nome}.`, "nome");
  if(nome) add(s1, `Piacere, ${nome}.`, `Nice to meet you, I'm ${nome}.`);
  if(naz) add(s1, `Sono ${G(naz[1], naz[2])}.`, `I'm ${naz[4] === "the United States" ? "American" : "from " + naz[4]}.`, "dove");
  if(p.citta) add(s1, `Sono di ${p.citta}${p.regione?", in "+p.regione:""}.`,
    `I'm from ${p.citta}${p.regione?", in "+p.regione:""}.`);

  if(p.eta) add(s1, `Ho ${numIt(p.eta)} anni.`, `I'm ${p.eta}.`);
  add(s1, `Parlo un po' d'italiano, sto imparando.`, `I speak a little Italian, I'm learning.`, "parla");
  const ling = (p.lingue||[]).map(c=>(LINGUE.find(l=>l[0]===c)||[])[0]).filter(Boolean);
  if(ling.length) add(s1, `Parlo ${joinIt(ling)}.`, `I speak ${(p.lingue||[]).map(c=>(LINGUE.find(l=>l[0]===c)||[])[1]).join(" and ")}.`);
  add(s1, `Scusi, può parlare più lentamente?`, `Sorry, could you speak more slowly?`);

  /* ---- family ---- */
  const s2 = sec("La mia famiglia", "Partner, children, and who's here with you.");
  if(p.stato === "sposato") add(s2, `Sono ${G("sposato","sposata")}.`, `I'm married.`, "sposato");
  if(p.stato === "compagno") add(s2, `Ho ${G("una compagna","un compagno")}.`, `I have a partner.`, "sposato");
  if(p.stato === "single") add(s2, `Sono single.`, `I'm single.`, "sposato");
  if(p.stato === "divorziato") add(s2, `Sono ${G("divorziato","divorziata")}.`, `I'm divorced.`, "sposato");
  if(p.stato === "vedovo") add(s2, `Sono ${G("vedovo","vedova")}.`, `I'm widowed.`, "sposato");
  if(p.partner){
    const w = p.stato === "sposato" ? G("mia moglie","mio marito") : G("la mia compagna","il mio compagno");
    const wEn = p.stato === "sposato" ? (f ? "my husband" : "my wife") : "my partner";
    add(s2, `${w[0].toUpperCase()+w.slice(1)} si chiama ${p.partner}.`, `${wEn[0].toUpperCase()+wEn.slice(1)} is called ${p.partner}.`);
    add(s2, `Sono qui con ${w}.`, `I'm here with ${wEn}.`);
  }
  const figli = (p.figli||[]).filter(x=>x.name || x.rel);
  if(figli.length){
    const n = figli.length;
    add(s2, n === 1 ? `Ho ${figli[0].rel==="figlia"?"una figlia":"un figlio"}.` : `Ho ${numIt(n)} figli.`,
        n === 1 ? `I have one child.` : `I have ${n} children.`, "figli");
    const named = figli.filter(x=>x.name);
    if(named.length) add(s2, named.length===1 ? `Si chiama ${named[0].name}.` : `Si chiamano ${joinIt(named.map(x=>x.name))}.`,
      named.length===1 ? `He's called ${named[0].name}.` : `They're called ${joinEn(named.map(x=>x.name))}.`);
    figli.filter(x=>x.name && x.age).forEach(x=>{
      const r = relOf(x.rel);
      add(s2, `${r[1][0].toUpperCase()+r[1].slice(1)} ${x.name} ha ${numIt(x.age)} anni.`,
             `${r[2][0].toUpperCase()+r[2].slice(1)} ${x.name} is ${x.age}.`);
    });
  } else if(p.figli) add(s2, `Non ho figli.`, `I don't have children.`, "figli");
  const con = (p.congiunti||[]).filter(x=>x.name);

    const kinds = [...new Set(con.map(x=>relOf(x.rel)[1]))];
    if(kinds.length > 2) add(s2, `C'è tutta la famiglia: ${joinIt(kinds.slice(0,5))}.`,

  if((p.interessi||[]).includes("escursioni")) add(s7, `Ci sono bei sentieri qui vicino?`, `Are there good trails nearby?`);
  if((p.interessi||[]).includes("mare")) add(s7, `Qual è la spiaggia più bella?`, `Which is the nicest beach?`);
  if((p.interessi||[]).includes("cibo")) add(s7, `Qual è il piatto tipico di qui?`, `What's the local dish here?`);
  if(p.motivo === "matrimonio"){
    add(s7, t?`Tu come conosci gli sposi?`:`Lei come conosce gli sposi?`, `How do you know the couple?`);
    add(s7, t?`Sei un amico dello sposo o della sposa?`:`È un amico dello sposo o della sposa?`,
        `Are you a friend of the groom or the bride?`);
    add(s7, `Da dove siete arrivati?`, `Where have you all come from?`);
  }
  if(p.motivo === "radici") add(s7, `Conosce qualcuno con il mio cognome qui?`, `Do you know anyone here with my surname?`);
  add(s7, t?`Ci scambiamo il numero?`:`Mi dà un numero di telefono?`, `Shall we swap numbers?`, null);
  return out.filter(s => s.c.length);
}

/* ============================================================
   My phrases: the sheet's output, editable, drillable, portable
   ============================================================ */
let profileView = "cards";
function myCards(){
  const secs = buildProfile();
  const ed = S.profileEdits || {};
  secs.forEach(s => s.c.forEach(c => { if(ed[c.id]) c.a = [ed[c.id], c.a[1]]; }));
  return secs;
}
function myCardItems(){
  return myCards().flatMap(s => s.c.map((c,i)=>({it:c.a[0], en:c.a[1], ph:"", cat:"mine", key:"me:"+c.id})));
}
function renderMyPhrases(host){
  const p = S.profile || {};
  if(!S.profileDone && !Object.keys(p).length){
    host.innerHTML = `
      <div class="card">
        <p style="margin:0 0 10px">Fill in a short sheet about yourself — name, family, work, what you like, why you're in Italy — and the app writes your own phrasebook from it: the questions people will ask you, with your answers ready in Italian.</p>
        <p class="small" style="margin:0 0 12px">Six short steps, everything optional. It stays on this device and is never sent anywhere.</p>
        <button class="btn wide" id="startSheet">Fill in the sheet</button>
      </div>`;
    $("#startSheet").onclick = ()=>{ sheetStep = 0; S.sheetOpen = true; save(); renderSheet(); };
    return;
  }
  const secs = myCards();
  const n = secs.reduce((a,s)=>a+s.c.length,0);
  const reg = S.profileReg || "lei";
  host.innerHTML = `
    <div class="card tight">
      <div class="row" style="align-items:center">
        <div class="grow"><b>${n} phrases, written for you</b>
          <div class="small">${esc(p.nome||"You")} · rebuilt whenever you change an answer</div></div>
        <button class="btn quiet" id="editSheet">Edit sheet</button>
      </div>
      <div class="chips" style="margin:10px 0 0">
        <button class="chip" data-reg="lei" aria-pressed="${reg==="lei"}">Formal (lei)</button>
        <button class="chip" data-reg="tu" aria-pressed="${reg==="tu"}">Informal (tu)</button>
      </div>
      <div class="row" style="gap:8px;margin-top:10px">
        <button class="btn quiet grow" id="drillMine">Practise these</button>
        <button class="btn quiet grow" id="expMine">Export</button>
      </div>
    </div>
    ${secs.map(s=>`
      <h3 style="font-family:var(--serif);font-size:18px;margin:18px 0 2px">${esc(s.t)}</h3>
      <p class="small" style="margin:0 0 8px">${esc(s.b)}</p>
      <div class="card" style="padding:2px 12px">
        ${s.c.map(c=>`
          <div class="phrase">
            ${c.q?`<div class="small" style="color:var(--blu)">
                <button class="speak" style="width:26px;height:26px;font-size:11px;vertical-align:middle" data-say="${esc(c.q.it)}">▶</button>
                ${esc(c.q.it)} — ${esc(c.q.en)}</div>`:""}
            <div class="row" style="margin-top:4px">
              <button class="speak" data-say="${esc(c.a[0])}">▶</button>
              <div class="grow"><div class="it">${gloss(c.a[0])}</div><div class="en">${esc(c.a[1])}</div></div>
              <button class="star" data-editc="${esc(c.id)}" style="font-size:14px" title="Edit">✎</button>
            </div>
          </div>`).join("")}
      </div>`).join("")}
    <p class="small" style="margin-top:14px">Names, films and bands are printed as you typed them. Tap ✎ on any card to reword it — your version is kept.</p>`;
  $("#editSheet").onclick = ()=>{ sheetStep = 0; S.sheetOpen = true; save(); renderSheet(); };
  $("#drillMine").onclick = ()=>{ go("drills"); startDrill("mix","mine"); };
  $("#expMine").onclick = exportProfile;
  host.querySelectorAll("[data-reg]").forEach(b=> b.onclick = ()=>{ S.profileReg = b.dataset.reg; save(); renderSaved(); });
  host.querySelectorAll("[data-editc]").forEach(b=> b.onclick = ()=>{
    const id = b.getAttribute("data-editc");
    const card = myCards().flatMap(s=>s.c).find(c=>c.id===id);
    const v = prompt("Reword this phrase:", card ? card.a[0] : "");
    if(v === null) return;
    S.profileEdits = S.profileEdits || {};
    if(v.trim()) S.profileEdits[id] = v.trim(); else delete S.profileEdits[id];
    save(); renderSaved();
  });
}
function exportProfile(){
  const blob = {app:"andiamo", build:BUILD, saved:new Date().toISOString(),
    profile:S.profile||{}, profileEdits:S.profileEdits||{}, profileReg:S.profileReg||"lei",
    notes:S.notes||[], list:S.list||{}, star:S.star||{}};
  try{
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(blob,null,2)], {type:"application/json"}));
    a.download = "andiamo-" + (S.profile && S.profile.nome ? norm(S.profile.nome).replace(/\s/g,"") : "profile") + ".json";
    a.click(); URL.revokeObjectURL(a.href);
    toast("Saved to your downloads");
  }catch(e){ toast("Download blocked here — try a normal browser tab"); }
}
function importProfile(file){
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const d = JSON.parse(r.result);
      if(d.app !== "andiamo") throw 0;
      S.profile = d.profile || {};
      S.profileEdits = d.profileEdits || {};
      S.profileReg = d.profileReg || "lei";
      S.profileDone = true;
      if(d.notes) S.notes = (S.notes||[]).concat(d.notes.filter(n=>!(S.notes||[]).some(x=>x.id===n.id)));
      if(d.list) S.list = Object.assign({}, d.list, S.list||{});
      if(d.star) S.star = Object.assign({}, d.star, S.star||{});
      save(); profileView = "cards"; renderSaved();
      toast("Loaded — your phrases are back");
    }catch(e){ toast("That file isn't an Andiamo export"); }
  };
  r.readAsText(file);
}

/* ---------- keep the app up to date, and working offline ---------- */
let swReg = null, reloading = false;

function showUpdateBar(){
  setUpd("new");
  if(document.getElementById("updbar")) return;
  const bar = document.createElement("div");
  bar.id = "updbar"; bar.className = "updbar";
  bar.innerHTML = `<span>A newer build is ready.</span><button class="btn" id="updNow">Load it</button>`;
  document.body.appendChild(bar);
  bar.querySelector("#updNow").onclick = ()=>{
    const wtg = swReg && (swReg.waiting || swReg.installing);
    if(wtg) wtg.postMessage("SKIP_WAITING");
    setTimeout(()=>location.reload(), 300);
  };
}

async function checkForUpdate(loud){
  if(!navigator.onLine){ setUpd("offline"); if(loud) toast("You're offline — running the cached build"); return; }
  if(!swReg){
    if(loud){ toast("Reloading the newest build…"); setTimeout(()=>location.reload(true), 600); }
    return;
  }
  if(loud) toast("Checking GitHub…");
  try{
    await swReg.update();
    setTimeout(()=>{
      if(swReg.waiting || swReg.installing){
        setUpd("new"); showUpdateBar();
      } else {
        setUpd("latest");
        if(loud) toast("You're on the newest build — " + VERSTAMP);
      }
    }, 1200);
  }catch(e){ setUpd("unknown"); if(loud) toast("Couldn't reach GitHub just now"); }
}

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", async ()=>{
    try{
      swReg = await navigator.serviceWorker.register("sw.js");
      if(navigator.serviceWorker.controller){
        swReg.addEventListener("updatefound", ()=>{
          const nw = swReg.installing;
          if(!nw) return;
          nw.addEventListener("statechange", ()=>{ if(nw.state === "installed") showUpdateBar(); });
        });
      }
      checkForUpdate(false);
    }catch(e){}
  });
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    if(reloading) return;
    reloading = true;
    location.reload();
  });
  /* check again whenever you come back to the app */
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) checkForUpdate(false); });
}

window.addEventListener("offline", ()=> setUpd("offline"));
window.addEventListener("online",  ()=> checkForUpdate(false));

/* ---------- go ---------- */
touchStreak();
paintHeader();
go("home");
</script>
