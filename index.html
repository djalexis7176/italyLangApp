<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123449">
<meta name="description" content="Andiamo — practical Italian for travellers: phrases, verb conjugation, flashcards and role-play drills for food, wine, craft beer, art, trains and directions.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:title" content="Andiamo — Italian for travellers">
<meta property="og:description" content="Phrases, verbs, flashcards and role-play for food, wine, craft beer, art, trains and directions.">

<title>Andiamo — Italian for travellers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E2230;
  --blu:#1D5C82;
  --blu-dark:#123449;
  --blu-soft:#E4EDF3;
  --rosso:#B03A2B;
  --oro:#C9962F;
  --verde:#4A6B3A;
  --carta:#FBF8F2;
  --tile:#FFFFFF;
  --line:#D8D2C6;
  --muted:#6C7A84;
  --radius:14px;
  --shadow:0 1px 0 rgba(14,34,48,.06), 0 6px 18px -12px rgba(14,34,48,.35);
  --serif:"Bodoni Moda", Georgia, "Times New Roman", serif;
  --sans:"Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);
  background:var(--carta);
  color:var(--ink);
  -webkit-text-size-adjust:100%;
  line-height:1.5;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blu)}

/* ---------- shell ---------- */
#app{max-width:760px;margin:0 auto;padding:0 16px 120px;}
header.top{
  position:sticky;top:0;z-index:40;
  margin:0 -16px 14px;padding:10px 16px 10px;
  background:var(--blu-dark);
  color:#fff;
  display:flex;align-items:center;gap:12px;
  box-shadow:0 1px 0 rgba(0,0,0,.15);
}
header.top .mark{
  font-family:var(--serif);font-weight:700;font-size:22px;letter-spacing:.01em;line-height:1;
}
header.top .ver{
  display:block;margin-top:3px;background:none;border:0;padding:0;
  font-size:11px;letter-spacing:.02em;color:#9FBED2;font-weight:500;
}
header.top .ver.latest{color:#A9D3A0}
header.top .ver.new{color:var(--oro);font-weight:700}
header.top .mark span{color:var(--oro)}
header.top .streak{
  margin-left:auto;font-size:12.5px;letter-spacing:.02em;color:#BFD5E4;
  display:flex;align-items:center;gap:8px;
}
header.top .streak b{color:#fff;font-weight:600}
.iconbtn{
  background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:9px;
  padding:6px 9px;font-size:13px;
}

/* ---------- nav ---------- */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(251,248,242,.97);
  backdrop-filter:saturate(140%) blur(8px);
  border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  display:flex;justify-content:center;gap:2px;
}
nav.tabs button{
  flex:1 1 0;max-width:110px;background:none;border:0;padding:7px 2px 5px;
  color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.01em;
  display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:10px;
}
nav.tabs button .g{font-family:var(--serif);font-size:19px;line-height:1;font-weight:700}
nav.tabs button[aria-current="true"]{color:var(--blu);background:var(--blu-soft)}

/* ---------- type ---------- */
h1{font-family:var(--serif);font-weight:700;font-size:30px;line-height:1.12;margin:14px 0 6px;letter-spacing:-.01em}
h2{font-family:var(--serif);font-weight:700;font-size:21px;margin:26px 0 8px}
h3{font-size:14px;font-weight:700;margin:18px 0 6px;letter-spacing:.01em}
p.lede{color:var(--muted);margin:0 0 14px;max-width:60ch}
.small{font-size:13px;color:var(--muted)}
.it{font-weight:600}
.ph{font-family:var(--serif);font-style:italic;color:var(--blu);font-size:14.5px}

/* ---------- cards ---------- */
.card{
  background:var(--tile);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin:10px 0;box-shadow:var(--shadow);
}
.card.tight{padding:11px 12px}
.row{display:flex;gap:10px;align-items:flex-start}
.grow{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.chip{
  border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;
}
.chip[aria-pressed="true"]{background:var(--blu);border-color:var(--blu);color:#fff}
.btn{
  background:var(--blu);color:#fff;border:0;border-radius:11px;
  padding:12px 16px;font-weight:600;font-size:15px;
}
.btn.ghost{background:#fff;color:var(--blu);border:1.5px solid var(--blu)}
.btn.quiet{background:var(--blu-soft);color:var(--blu-dark)}
.btn.wide{display:block;width:100%;text-align:center}
.btn:disabled{opacity:.45}
.speak{
  border:1px solid var(--line);background:#fff;border-radius:10px;width:38px;height:38px;
  flex:0 0 38px;display:grid;place-items:center;font-size:15px;color:var(--blu);
}
.star{border:0;background:none;font-size:17px;line-height:1;color:var(--line);padding:4px}
.star[aria-pressed="true"]{color:var(--oro)}

/* ---------- hero (home only) ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:18px;color:#fff;
  background:
    radial-gradient(circle at 12% 18%, rgba(201,150,47,.55) 0 9px, transparent 10px),
    radial-gradient(circle at 88% 82%, rgba(176,58,43,.55) 0 9px, transparent 10px),
    repeating-linear-gradient(45deg, rgba(255,255,255,.05) 0 12px, transparent 12px 24px),
    linear-gradient(160deg,#1D5C82,#123449 70%);
  padding:22px 20px 20px;margin-top:14px;
}
.hero h1{margin:0 0 6px;font-size:34px;color:#fff}
.hero p{margin:0;color:#CBDDE9;font-size:14.5px;max-width:44ch}
.hero .meter{margin-top:16px;display:flex;gap:14px;font-size:12.5px;color:#CBDDE9}
.hero .meter b{display:block;font-family:var(--serif);font-size:22px;color:#fff;font-weight:700}

/* ---------- lists ---------- */
.phrase{border-bottom:1px solid var(--line);padding:11px 0}
.phrase:last-child{border-bottom:0}
.phrase .en{font-size:14px;color:var(--muted)}
details.acc{border:1px solid var(--line);border-radius:var(--radius);background:#fff;margin:8px 0;overflow:hidden}
details.acc>summary{padding:13px 14px;font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"+";margin-left:auto;color:var(--blu);font-weight:700;font-size:18px}
details.acc[open]>summary::after{content:"–"}
details.acc .body{padding:0 14px 12px}
.count{font-size:12px;color:var(--muted);font-weight:500}

/* ---------- tables ---------- */
table.conj{width:100%;border-collapse:collapse;font-size:14.5px;margin:6px 0}
table.conj td{padding:7px 6px;border-bottom:1px solid var(--line)}
table.conj td:first-child{color:var(--muted);width:34%}
table.conj td:last-child{font-weight:600}
table.conj tr:last-child td{border-bottom:0}
.ending{color:var(--rosso);font-weight:700}

/* ---------- drills ---------- */
.opt{
  display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);
  border-radius:12px;padding:13px 14px;margin:8px 0;font-size:15.5px;font-weight:500;
}
.opt.correct{border-color:var(--verde);background:#EEF4E9}
.opt.wrong{border-color:var(--rosso);background:#FBEDEB}
.opt.dim{opacity:.5}
.bar{height:6px;background:var(--blu-soft);border-radius:99px;overflow:hidden;margin:2px 0 14px}
.bar i{display:block;height:100%;background:var(--blu);transition:width .25s}
.fb{border-radius:12px;padding:12px 14px;margin:10px 0;font-size:14.5px}
.fb.ok{background:#EEF4E9;border:1px solid #C4D8B6}
.fb.no{background:#FBEDEB;border:1px solid #E8C3BC}
.flash{
  min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:10px;padding:26px 18px;
}
.flash .big{font-family:var(--serif);font-size:29px;font-weight:700;line-height:1.2}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match{
  border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 8px;
  font-size:14px;font-weight:600;min-height:62px;display:grid;place-items:center;text-align:center;
}
.match.sel{border-color:var(--blu);background:var(--blu-soft)}
.match.done{opacity:.25;border-style:dashed}
.match.err{border-color:var(--rosso);background:#FBEDEB}
input.answer{
  width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;
  background:#fff;font-size:16px;
}
input.answer:focus{outline:2px solid var(--blu);outline-offset:1px;border-color:var(--blu)}
.line{display:flex;gap:9px;margin:9px 0;align-items:flex-start}
.line .who{
  flex:0 0 54px;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--muted);
  padding-top:4px;
}
.line.you .bubble{background:var(--blu-soft);border-color:#C6DAE7}
.bubble{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;flex:1}
.hidden{display:none !important}
.tokens{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.token{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-size:15px}
.slot{min-height:52px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;background:#fff}
.pill{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.03em;
  background:var(--blu-soft);color:var(--blu-dark);border-radius:999px;padding:3px 9px}
.pill.gold{background:#F7ECD2;color:#7A5A12}
.pill.red{background:#FBEDEB;color:#8C2A1E}
.pill.green{background:#EEF4E9;color:#3C5730}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:60;
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;
  opacity:0;transition:opacity .2s;pointer-events:none;
}
.toast.show{opacity:1}
.searchwrap{position:relative;margin:6px 0 4px}
.searchwrap input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:16px}
.note{background:var(--blu-soft);border-left:3px solid var(--blu);padding:11px 13px;border-radius:0 10px 10px 0;margin:10px 0;font-size:14.5px}
.note.gold{background:#F9F1DE;border-color:var(--oro)}
ol.plan{padding-left:0;list-style:none;margin:0}
ol.plan li{border-left:2px solid var(--line);padding:0 0 18px 16px;position:relative}
ol.plan li:last-child{border-left-color:transparent;padding-bottom:0}
ol.plan li::before{
  content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;
  background:var(--blu);
}
ol.plan li b{display:block;font-size:15px}
/* tappable words + word sheet */
.w{cursor:pointer;border-bottom:1px dotted rgba(29,92,130,.45);padding-bottom:1px}
.w:active{background:#F7ECD2}
.sheetbg{position:fixed;inset:0;z-index:80;background:rgba(14,34,48,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--carta);width:100%;max-width:600px;max-height:86vh;overflow:auto;
  border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 40px rgba(14,34,48,.35)}
@media (min-width:640px){.sheetbg{align-items:center}.sheet{border-radius:18px;max-height:80vh}}
.notebox{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;background:#fff;resize:vertical}
.notebox:focus{outline:2px solid var(--blu);outline-offset:1px}
.notetext{white-space:pre-wrap;margin-top:6px;font-size:15px}
.hint{font-size:12.5px;color:var(--muted);margin:2px 0 10px}
.updbar{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:70;
  background:var(--blu-dark);color:#fff;border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;
  font-size:14px;box-shadow:0 8px 24px rgba(14,34,48,.35)}
.updbar .btn{padding:8px 12px;font-size:14px;background:var(--oro);color:#12222c;margin-left:auto}
.conjlist{margin:8px 0 4px}
.crow{border-bottom:1px solid var(--line);padding:9px 0}
.crow:last-child{border-bottom:0}
.crow.hit{background:#F9F1DE;border-radius:8px;padding:9px 8px;border-bottom:0;margin:2px 0}
.crow .pron{color:var(--muted);font-size:13px;min-width:56px;display:inline-block}
.crow .form{font-weight:700;font-size:16px}
.crow .eng{color:var(--blu);font-size:14px}
.crow .ex{display:flex;gap:8px;align-items:flex-start;margin:6px 0 0 0;font-size:14px}
.crow .ex .speak{width:30px;height:30px;flex:0 0 30px;font-size:12px}
.crow .exen{color:var(--muted);font-size:13.5px}
.ex{display:flex;gap:8px;align-items:flex-start;font-size:14.5px}
.ex .speak{width:30px;height:30px;flex:0 0 30px;font-size:12px}
.exen{color:var(--muted);font-size:13.5px}
.azrow{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 12px}
.az{border:1px solid var(--line);background:#fff;border-radius:8px;min-width:28px;padding:5px 0;
  font-size:12.5px;font-weight:700;color:var(--blu)}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
@media (max-width:400px){
  header.top .mark{font-size:19px}
  header.top .ver{font-size:10px}
  header.top .streak{font-size:11.5px;gap:6px}
  header.top .streak span:nth-child(2){display:none}
}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2.5px solid var(--oro);outline-offset:2px}
@media (min-width:700px){
  .grid2{grid-template-columns:repeat(4,1fr)}
  h1{font-size:36px}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div>
      <div class="mark">Andiamo<span>.</span></div>
      <button class="ver" id="verBtn" title="Tap to check for a newer build">v0.0 · 0.0.00</button>
    </div>
    <div class="streak">
      <span>Streak <b id="streakN">0</b></span>
      <span>Learned <b id="xpN">0</b></span>
      <button class="iconbtn" id="voiceBtn" title="Voice settings">Voice</button>
    </div>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" id="tabs">
  <button data-tab="home"><span class="g">A</span>Today</button>
  <button data-tab="phrases"><span class="g">F</span>Phrases</button>
  <button data-tab="words"><span class="g">V</span>Words</button>
  <button data-tab="drills"><span class="g">E</span>Practice</button>
  <button data-tab="plan"><span class="g">P</span>Plan</button>
  <button data-tab="saved"><span class="g">S</span>Saved</button>
</nav>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   ANDIAMO — Italian for travellers
   Single-file app. No build step, no dependencies.
   Data first, then engine, then views.
   ============================================================ */

/* ---------- DATA: phrases [italian, english, pronunciation] ---------- */
const CATS = [
 {id:"saluti", name:"Greetings & introductions", blurb:"Open a conversation and say who you are."},
 {id:"io", name:"Your background & small talk", blurb:"Work, family, where you're from, how long you're staying."},
 {id:"gusti", name:"Likes & dislikes", blurb:"Mi piace / non mi piace — for you and your partner."},
 {id:"storie", name:"Books, films & series", blurb:"Science fiction, crime dramas, what you're reading."},
 {id:"arte", name:"Art & museums", blurb:"Modern, abstract, frescoes, and saying what you feel."},
 {id:"caffe", name:"Coffee & the bar", blurb:"Ordering at the counter like a local."},
 {id:"ristorante", name:"Restaurant & ordering", blurb:"Booking, menu questions, spicy or not, the bill."},
 {id:"salumi", name:"Cheese & cured meats", blurb:"Tagliere, salami, prosciutto, mortadella, pecorino."},
 {id:"vino", name:"Wine & tasting", blurb:"Tasting notes, grapes, cellars, how it's made."},
 {id:"birra", name:"Craft beer", blurb:"IPA, sour, stout, lager — and how to find the good stuff."},
 {id:"richieste", name:"Requests & politeness", blurb:"The five formulas that carry most of the trip."},
 {id:"strada", name:"Directions", blurb:"Getting yourself unlost."},
 {id:"trasporti", name:"Trains, buses, boats, planes", blurb:"Tickets, platforms, times, luggage."},
 {id:"orari", name:"Opening times & tickets", blurb:"When to go, when to skip, how to book."},
 {id:"consigli", name:"Recommendations", blurb:"Ask a local where to find the good version of anything."},
 {id:"viaggi", name:"Where we've been & where we're going", blurb:"Past trips and today's plan."},
 {id:"misure", name:"Sizes, strength & what's in it", blurb:"Sizes, alcohol content, calories, allergens."},
 {id:"soldi", name:"Numbers, prices & paying", blurb:"How much, card or cash, splitting."},
 {id:"aiuto", name:"Useful problems", blurb:"Pharmacy, wifi, toilets, lost things."}
];

const P = {};

P.saluti = [
["Buongiorno!","Good morning / Good day","bwon-JOR-no"],
["Buonasera!","Good evening","bwo-na-SEH-ra"],
["Ciao!","Hi / Bye (informal)","chow"],
["Salve!","Hello (polite, neutral)","SAL-veh"],
["Arrivederci!","Goodbye (polite)","a-rri-ve-DER-chee"],
["A presto!","See you soon","a PRES-to"],
["Come sta?","How are you? (formal)","KO-meh sta"],
["Come stai?","How are you? (informal)","KO-meh sty"],
["Sto bene, grazie. E lei?","I'm well, thanks. And you? (formal)","sto BEH-neh GRA-tsyeh eh lay"],
["Mi chiamo Marco. E lei?","My name is Marco. And you?","mee KYA-mo MAR-ko"],
["Piacere di conoscerla.","Pleased to meet you (formal).","pya-CHEH-reh dee ko-NO-sher-la"],
["Piacere mio!","My pleasure!","pya-CHEH-reh MEE-o"],
["Questa è mia moglie, Anna.","This is my wife, Anna.","KWES-ta eh MEE-a MO-lyeh"],
["Questo è mio marito, Paolo.","This is my husband, Paolo.","KWES-to eh MEE-o ma-REE-to"],
["Scusi, parla inglese?","Excuse me, do you speak English?","SKOO-zee PAR-la een-GLEH-zeh"],
["Parlo un po' d'italiano.","I speak a little Italian.","PAR-lo oon po dee-ta-LYA-no"],
["Può ripetere più lentamente, per favore?","Can you repeat that more slowly, please?","pwo ree-PEH-teh-reh pyoo len-ta-MEN-teh"],
["Non ho capito, mi scusi.","I didn't understand, sorry.","non o ka-PEE-to mee SKOO-zee"],
["Come si dice ... in italiano?","How do you say ... in Italian?","KO-meh see DEE-cheh"],
["Buona giornata!","Have a good day!","BWO-na jor-NA-ta"]
];

P.io = [
["Sono americano. / Sono americana.","I'm American. (m / f)","SO-no a-me-ree-KA-no"],
["Siamo di San Diego, in California.","We're from San Diego, in California.","SYA-mo dee ... in ka-lee-FOR-nya"],
["È la nostra prima volta in Italia.","It's our first time in Italy.","eh la NOS-tra PREE-ma VOL-ta"],
["Siamo qui per due settimane.","We're here for two weeks.","SYA-mo kwee per DOO-eh set-tee-MA-neh"],
["Siamo in vacanza.","We're on holiday.","SYA-mo een va-KAN-tsa"],
["Sono in pensione.","I'm retired.","SO-no een pen-SYO-neh"],
["Lavoro nel settore informatico.","I work in tech.","la-VO-ro nel set-TO-reh in-for-MA-tee-ko"],
["Sono insegnante. / Sono medico.","I'm a teacher. / I'm a doctor.","SO-no in-se-NYAN-teh"],
["Abbiamo due figli e un cane.","We have two children and a dog.","ab-BYA-mo DOO-eh FEE-lyee"],
["Mia nonna era italiana, di Napoli.","My grandmother was Italian, from Naples.","MEE-a NON-na EH-ra ee-ta-LYA-na"],
["Studio l'italiano da sei mesi.","I've been studying Italian for six months.","STOO-dyo lee-ta-LYA-no da say MEH-zee"],
["Nel tempo libero cucino e cammino.","In my free time I cook and I walk.","nel TEM-po LEE-beh-ro koo-CHEE-no"],
["E lei, di dov'è?","And you, where are you from?","eh lay dee do-VEH"],
["Che lavoro fa?","What do you do for work?","keh la-VO-ro fa"],
["Vive qui da molto tempo?","Have you lived here long?","VEE-veh kwee da MOL-to TEM-po"],

const GRAMMAR = [
{t:"How Italian verbs work, in one screen",
 h:["Every Italian verb in the dictionary ends in -are, -ere or -ire. That's the infinitive: 'to speak', 'to take', 'to leave'.",
    "Chop off those last three letters and you have the stem: parl-, prend-, part-.",
    "Then add an ending that says WHO is doing it. The ending does the job that 'I', 'you', 'we' do in English — which is why Italians usually drop the pronoun entirely.",
    "So: parlo = I speak. Parliamo = we speak. No 'io' or 'noi' needed unless you want emphasis.",
    "One more thing: Italian has no -ing form. Parlo covers 'I speak', 'I am speaking' and 'I do speak'. Three for the price of one."]},
{t:"The endings you need",
 h:["-are verbs: -o, -i, -a, -iamo, -ate, -ano  (parlo, parli, parla, parliamo, parlate, parlano)",
    "-ere verbs: -o, -i, -e, -iamo, -ete, -ono  (prendo, prendi, prende, prendiamo, prendete, prendono)",
    "-ire verbs: -o, -i, -e, -iamo, -ite, -ono  (parto, parti, parte, partiamo, partite, partono)",
    "-ire verbs, second type: some -ire verbs stretch out with -isc- (capisco, capisci, capisce, capiamo, capite, capiscono). Noi and voi never take it. A dictionary tells you which type; otherwise you pick it up by ear.",
    "Notice two patterns that never break: io always ends in -o, and noi always ends in -iamo."]},
{t:"Nouns have a gender — learn it with the article",
 h:["Don't learn casa. Learn la casa. Don't learn libro. Learn il libro. The article is part of the word.",
    "Rough rule: -o endings are usually masculine (il vino), -a endings usually feminine (la birra), -e endings could be either (il pane, la chiave).",
    "Plural: -o becomes -i (il vino → i vini), -a becomes -e (la birra → le birre), -e becomes -i (il pane → i pani).",
    "Adjectives follow the noun and match it: vino rosso, birra scura, vini rossi, birre scure."]},
{t:"Mi piace — the verb that runs backwards",
 h:["Italian doesn't say 'I like wine'. It says 'wine is pleasing to me': mi piace il vino.",
    "So the verb agrees with the THING, not with you. One thing: mi piace il vino. Several things: mi piacciono i formaggi.",
    "To say who likes it, put a in front of the person: a mia moglie piace la birra scura. A mio marito non piacciono i funghi.",
    "Negative: just add non at the front. Non mi piace. Non mi piacciono."]},
{t:"You already know hundreds of words",
 h:["English -y becomes Italian -ia: biology → la biologia, philosophy → la filosofia.",
    "English -ic / -ics becomes -ica: music → la musica, politics → la politica.",
    "English -ty becomes -tà: city → la città, university → l'università, opportunity → l'opportunità.",
    "English -tion becomes -zione: station → la stazione, reservation → la prenotazione, fermentation → la fermentazione.",
    "Try it before you look it up. You'll be right more often than you expect."]},
{t:"Questions: six words that open any door",
 h:["Dove? = where. Dov'è la stazione?",
    "Quando? = when. Quando aprite?",
    "Quanto? = how much. Quanto costa?",
    "Come? = how. Come si dice?",
    "Che cosa? = what. Che cosa ci consiglia?",
    "Perché? = why (and also 'because'). Perché no?",
    "Italian asks questions with tone of voice alone. Word order doesn't change: È aperto. → È aperto? Just lift your voice at the end."]},
{t:"Past and future without new grammar",
 h:["For the future, just use the present tense with a time word: domani andiamo a Siena. Stasera mangiamo qui. Italians do this constantly.",
    "For the past, you need two building blocks. With avere: abbiamo visitato, abbiamo mangiato, ho preso.",
    "With essere (for coming, going, staying): siamo andati, siamo stati, sono arrivato. With essere the ending agrees: siamo andati / siamo andate.",
    "Two ready-made sentences worth memorising whole: Siamo già stati a Roma. Non siamo mai stati in Sicilia."]},
{t:"Memory hooks that stick",
 h:["Link the new word to something you already know — a sound, an image, a person. It doesn't have to make sense to anyone but you.",
    "Salve (formal hello) → 'greetings and salutations'. Formal, old-fashioned, exactly the right register.",
    "Lui (he) and lei (she) → King Louis and Princess Leia.",
    "Tavolo (table) → a table covered in tapas: 'tapas volo'.",
    "Chiara (pale beer) → clear. Scura (dark) → obscure. Both are already in English.",
    "Make yours weird. Weird is what your brain keeps."]}

  try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return localStorage; }
  catch(e){ const m={}; return {getItem:k=>(k in m?m[k]:null), setItem:(k,v)=>{m[k]=String(v)}, removeItem:k=>{delete m[k]}}; }
})();
const DEF = {xp:0, streak:0, last:"", start:"", box:{}, star:{}, seen:{}, day:1, rate:0.9, voice:"", list:{}, notes:[], draft:"", profile:{}, profileEdits:{}, profileReg:"lei", profileDone:false, sheetOpen:false};
let S = Object.assign({}, DEF, JSON.parse(store.getItem("andiamo")||"{}"));
const save = () => store.setItem("andiamo", JSON.stringify(S));
function today(){ return new Date().toISOString().slice(0,10); }
function touchStreak(){
  const t = today();
  if(S.last === t) return;
  const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
  S.streak = (S.last === y) ? S.streak+1 : 1;
  S.last = t;
  if(!S.start) S.start = t;
  save();
}
function daysIn(){
  if(!S.start) return 1;
  const d = Math.floor((new Date(today()) - new Date(S.start))/86400000)+1;
  return Math.max(1, Math.min(PLAN.length, d));
}
function addXp(n){ S.xp += n; save(); paintHeader(); }
function paintHeader(){
  $("#streakN").textContent = S.streak;
  $("#xpN").textContent = S.xp;
  paintVersion();
}
function paintVersion(){
  const b = $("#verBtn");
  if(!b) return;
  b.className = "ver" + (UPD.state === "latest" ? " latest" : UPD.state === "new" ? " new" : "");
  b.textContent = VERSTAMP
    + (UPD.state === "latest" ? " ✓ latest"
     : UPD.state === "new"    ? " · update ready"
     : UPD.state === "offline"? " · offline"
     : "");
}
function setUpd(state){ UPD = {state, at:Date.now()}; paintVersion(); if(TAB === "plan") renderPlan(); }

/* --- helpers --- */
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const sample = (a,n) => shuffle(a).slice(0,n);
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/[’']/g,"'").replace(/[^a-z' ]/g,"").replace(/\s+/g," ").trim();
function scrollSafe(el){ try{ el && el.scrollIntoView && el.scrollIntoView({block:"nearest"}); }catch(e){} }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove("show"),1600); }

/* --- speech --- */
let voices = [];
function loadVoices(){ voices = (window.speechSynthesis ? speechSynthesis.getVoices() : []).filter(v=>/^it/i.test(v.lang)); }
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text){
  if(!window.speechSynthesis) { toast("This browser can't speak Italian"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(text).replace(/\.\.\./g,"…"));
  u.lang = "it-IT"; u.rate = S.rate;
  const v = voices.find(v=>v.name===S.voice) || voices[0];
  if(v) u.voice = v;
  speechSynthesis.speak(u);
}
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-say]");
  if(b){ speak(b.getAttribute("data-say")); }
});
$("#verBtn").onclick = () => checkForUpdate(true);
$("#voiceBtn").onclick = () => {
  loadVoices();
  const names = voices.map(v=>v.name);
  const cur = names.indexOf(S.voice);
  if(names.length){ S.voice = names[(cur+1) % names.length]; }
  const speeds = [0.7,0.8,0.9,1];
  S.rate = speeds[(speeds.indexOf(S.rate)+1) % speeds.length];
  save();
  toast((S.voice ? S.voice.split(" ")[0]+" · " : "") + "speed " + S.rate);
  speak("Andiamo! Parliamo italiano.");
};

/* --- flattened item pools --- */
const ALLPHRASES = [];
CATS.forEach(c => (P[c.id]||[]).forEach((p,i) => ALLPHRASES.push({it:p[0], en:p[1], ph:p[2], cat:c.id, key:"p:"+c.id+":"+i})));
QUICK.forEach(q => q.p.forEach((p,i) => ALLPHRASES.push({it:p[0], en:p[1], ph:"", cat:q.id, key:q.id+":"+i})));
const NOUNITEMS = NOUNS.map((n,i)=>({it:n[0], en:n[1], ph:"", cat:n[3], key:"n:"+i}));
const ADJITEMS  = ADJ.map((a,i)=>({it:a[0], en:a[1], ph:"", cat:"agg", key:"a:"+i}));
const catName = id => (CATS.find(c=>c.id===id) || QUICK.find(q=>q.id===id) || {name:id}).name
  || (QUICK.find(q=>q.id===id)||{}).t || id;

function deckItems(deck){
  if(deck === "mine") return myCardItems();
  if(deck && deck.slice(0,2) === "q_") return ALLPHRASES.filter(x => x.cat === deck);
  if(deck === "core") return CORE_WORDS.map((x,i)=>({it:x[0].replace(/…/g,""), en:x[1], ph:"", cat:"core", key:"c:"+i}));
  if(deck === "stories") return STORIES.flatMap((st,si)=> st.l.map((l,li)=>({it:l[0], en:l[1], ph:"", cat:"stories", key:"st:"+si+":"+li})));
  if(deck === "study") return Object.entries(S.list||{}).map(([k,v])=>({it:v.w, en:v.g||"(no meaning saved)", ph:"", cat:"study", key:"s:"+k}));
  if(deck === "all") return ALLPHRASES.concat(NOUNITEMS, ADJITEMS, deckItems("stories"));
  if(deck === "starred") return ALLPHRASES.concat(NOUNITEMS, ADJITEMS).filter(x=>S.star[x.key]);
  if(deck === "vocab") return NOUNITEMS.concat(ADJITEMS);
  return ALLPHRASES.filter(x=>x.cat===deck).concat(NOUNITEMS.filter(x=>x.cat===deck));
}
function boxOf(k){ return S.box[k] || 1; }
function grade(k, ok){
  S.box[k] = ok ? Math.min(5, boxOf(k)+1) : 1;
  S.seen[k] = (S.seen[k]||0)+1;
  if(ok) addXp(1); else save();
}
/* pick items, weakest first, with a little randomness */
function studyOrder(items, n){
  const scored = items.map(x=>({x, s: boxOf(x.key) + Math.random()*1.4}));
  scored.sort((a,b)=>a.s-b.s);
  return scored.slice(0, n).map(o=>o.x);
}

  box.innerHTML = hits.length
    ? `<div class="card">${hits.map(rowHTML).join("")}</div>`
    : `<div class="card"><p style="margin:0">Nothing matched “${esc(phraseQuery)}”. Try a shorter word, or a word in English.</p></div>`;

}

/* ---------- verb helpers, used by the dictionary and the word sheet ---------- */
function famLabel(v){ return v.irr ? "irregular" : (v.fam==="isc" ? "-ire (-isc-)" : "-"+v.fam); }
function hilite(v,i){
  const f = v.f[i];
  if(v.irr) return esc(f);
  const stem = v.i.slice(0,-3);
  if(f.startsWith(stem)) return esc(stem) + '<span class="ending">' + esc(f.slice(stem.length)) + '</span>';
  return esc(f);
}

/* --- step builders --- */
function pool(deck){
  let items = deckItems(deck);
  if(deck !== "study" && items.length < 8) items = deckItems("all");
  if(!items.length) items = deckItems("all");
  return items;
}
function buildFlash(deck,n){ return studyOrder(pool(deck), n).map(it=>({kind:"flash", it})); }
function buildQuiz(deck,n,mode){
  const p = pool(deck);
  return studyOrder(p, n).map(it=>{
    const dir = mode || (Math.random()<.5 ? "it2en" : "en2it");
    const others = sample(p.filter(x=>x.key!==it.key && x.en!==it.en), 3);
    const opts = shuffle([it].concat(others));
    return {kind:"quiz", it, opts, dir};
  });
}
function buildConj(n, list){
  const out = [];
  const vs = shuffle(list || VERBS);
  for(let i=0;i<n;i++){
    const v = vs[i % vs.length];
    out.push({kind:"conj", v, p: Math.random()*6|0});
  }
  return out;
}
function buildWhich(n){
  const all = [];
  PAIRS.forEach(pr => pr.items.forEach(it => all.push({kind:"which", pr, it})));
  return sample(all, n);
}
function buildCloze(deck,n){
  const p = pool(deck).filter(x=>x.it.split(" ").length>=4);
  const words = w => w.replace(/[^A-Za-zÀ-ÿ']/g,"");
  const bank = [...new Set(p.flatMap(x=>x.it.split(" ").map(words)).filter(w=>w.length>=4))];
  return sample(p, n).map(it=>{
    const toks = it.it.split(" ");
    const cands = toks.map((t,i)=>({t:words(t), i})).filter(o=>o.t.length>=4);
    const pick = cands.length ? cands[Math.random()*cands.length|0] : {t:words(toks[0]), i:0};
    const shown = toks.map((t,i)=> i===pick.i ? t.replace(pick.t,"_____") : t).join(" ");
    const opts = shuffle([pick.t].concat(sample(bank.filter(w=>w.toLowerCase()!==pick.t.toLowerCase()),3)));
    return {kind:"cloze", it, shown, ans:pick.t, opts};
  });
}
function buildQA(n){
  return sample(QA, n).map(q=>{
    const opts = shuffle([q].concat(sample(QA.filter(x=>x[2]!==q[2]),3)));
    return {kind:"qa", q, opts};
  });
}
function buildBuild(deck,n){
  const p = pool(deck).filter(x=>{const w=x.it.split(" ").length; return w>=4 && w<=7;});
  return sample(p, n).map(it=>({kind:"build", it, toks: shuffle(it.it.split(" "))}));
}
function startDrill(type, deck){
  deckSel = deck || deckSel;
  sess = null; special = null;
  touchStreak();
  if(type==="match") return startMatch(deckSel);
  if(type==="dialog") return startDialog();
  if(type==="story")  return startStory();
  let steps = [], title = "";
  switch(type){
    case "flash":  steps = buildFlash(deckSel,12); title="Flashcards"; break;
    case "quiz":   steps = buildQuiz(deckSel,10); title="Quick quiz"; break;
    case "listen": steps = buildQuiz(deckSel,10,"listen"); title="Listen & choose"; break;
    case "conj":   steps = buildConj(12); title="Conjugation trainer"; break;
    case "coreconj": steps = buildConj(16, CORE_VERBS.map(([v])=>ALLVERBS.find(x=>x.i===v)).filter(Boolean));
                     title="The sixteen verbs"; break;
    case "which":  steps = buildWhich(10); title="Which word?"; break;
    case "cloze":  steps = buildCloze(deckSel,10); title="Fill the gap"; break;
    case "qa":     steps = buildQA(10); title="Answer them"; break;
    case "build":  steps = buildBuild(deckSel,8); title="Sentence builder"; break;
    case "mix":    steps = shuffle(buildFlash(deckSel,4).concat(buildQuiz(deckSel,4), buildConj(3), buildWhich(2), buildQA(2), buildCloze(deckSel,2)));
                   title="Mixed session"; break;
  }
  sess = {type, title, steps, i:0, right:0, wrong:0, state:{}};
  go("drills");
}
function endSess(){ sess = null; special = null; renderDrills(); }
function nextStep(){ sess.i++; sess.state={}; paintStep(); }

/* --- session shell --- */
function paintStep(){
  if(!sess) return renderDrills();
  if(sess.i >= sess.steps.length) return paintDone();
  const s = sess.steps[sess.i];
  const pct = Math.round(sess.i / sess.steps.length * 100);
  view.innerHTML = `
    <div class="row" style="align-items:center;margin:14px 0 6px">
      <div class="grow"><div style="font-weight:700">${sess.title}</div>
      <div class="small">${sess.i+1} of ${sess.steps.length} · ${sess.right} right</div></div>
      <button class="btn quiet" id="exit">Stop</button>
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div id="stepBody"></div>`;
  $("#exit").onclick = endSess;
  ({flash:stepFlash, quiz:stepQuiz, conj:stepConj, which:stepWhich, cloze:stepCloze, qa:stepQA, build:stepBuild})[s.kind](s, $("#stepBody"));
}
function paintDone(){
  const total = sess.right + sess.wrong;
  const pct = total ? Math.round(sess.right/total*100) : 0;
  const msg = pct>=90 ? "Bravissimo." : pct>=70 ? "Solid. Same again tomorrow." : "Worth another pass — the ones you missed come back first.";
  view.innerHTML = `
    <h1 style="margin-top:26px">${sess.right} / ${total}</h1>
    <p class="lede">${msg}</p>
    <button class="btn wide" id="again">Go again</button>
    <button class="btn ghost wide" id="back" style="margin-top:8px">Back to practice</button>`;
  addXp(2);
  const t = sess.type, d = deckSel, fw = sess.focusWord, fn = sess.steps.length;
  $("#again").onclick = ()=> t === "focus" ? startFocus(fw, fn) : startDrill(t, d);
  $("#back").onclick = endSess;
}
function feedback(host, ok, html){
  const div = document.createElement("div");
  div.className = "fb " + (ok?"ok":"no");
  div.innerHTML = html;
  host.appendChild(div);
  const btn = document.createElement("button");
  btn.className = "btn wide"; btn.style.marginTop = "6px";
  btn.textContent = sess.i+1 >= sess.steps.length ? "Finish" : "Next";
  btn.onclick = nextStep;
  host.appendChild(btn);
  scrollSafe(btn);
}
function score(ok, key){
  if(key) grade(key, ok);
  if(ok) sess.right++; else sess.wrong++;
}

/* --- step: flashcard --- */
function stepFlash(s, host){
  const front = Math.random()<.5;
  host.innerHTML = `
    <div class="card flash" id="cardFace">
      <span class="pill">${front?"Italian":"English"}</span>

  face.onclick = (e)=>{

    flipped = !flipped;
    face.innerHTML = `<span class="pill">${(front!==flipped)?"Italian":"English"}</span>

/* ============================================================
   Matching game & role-play (full-screen modes)
   ============================================================ */
let special = null;
TABS.drills = function(){ if(special && !sess) return paintSpecial(); return renderDrills(); };
function paintSpecial(){
  if(special.type === "match") return paintMatch();
  if(special.type === "story") return special.pick ? paintStory() : paintStoryList();
  return paintDialogList();
}
function startMatch(deck){ special = {type:"match", deck}; buildMatch(); go("drills"); }
function startDialog(){ special = {type:"dialog", pick:null}; go("drills"); }

function buildMatch(){
  let p = pool(special.deck).filter(x=>x.it.length<=26);
  if(p.length < 6) p = pool(special.deck);
  const pairs = studyOrder(p, 6);
  special.pairs = pairs;
  special.tiles = shuffle(pairs.flatMap((x,i)=>[{k:i,side:"it",t:x.it,key:x.key},{k:i,side:"en",t:x.en,key:x.key}]));
  special.done = []; special.sel = null; special.moves = 0;
}
function paintMatch(){
  const left = special.tiles.length - special.done.length*2;
  view.innerHTML = `
    <div class="row" style="align-items:center;margin:14px 0 6px">
      <div class="grow"><div style="font-weight:700">Matching</div>
        <div class="small">${special.done.length} of ${special.pairs.length} pairs · ${special.moves} taps</div></div>
      <button class="btn quiet" id="exit">Stop</button>
    </div>
    <div class="bar"><i style="width:${special.done.length/Math.max(1,special.pairs.length)*100}%"></i></div>
    <div class="grid2" id="board">
      ${special.tiles.map((t,i)=>`<button class="match ${special.done.includes(t.k)?"done":""} ${special.sel===i?"sel":""}"
        data-i="${i}" ${special.done.includes(t.k)?"disabled":""}>${esc(t.t)}</button>`).join("")}
    </div>
    ${left===0 ? `<button class="btn wide" id="again" style="margin-top:14px">New round</button>
                  <button class="btn ghost wide" id="back" style="margin-top:8px">Back to practice</button>` : ""}`;
  $("#exit").onclick = ()=>{ special=null; renderDrills(); };
  if($("#again")) $("#again").onclick = ()=>{ buildMatch(); paintMatch(); };
  if($("#back")) $("#back").onclick = ()=>{ special=null; renderDrills(); };
  view.querySelectorAll("[data-i]").forEach(b=> b.onclick = ()=>{
    const i = +b.dataset.i, t = special.tiles[i];
    special.moves++;
    if(special.sel === null){ special.sel = i; if(t.side==="it") speak(t.t); return paintMatch(); }
    if(special.sel === i){ special.sel = null; return paintMatch(); }
    const prev = special.tiles[special.sel];
    if(prev.k === t.k){
      special.done.push(t.k); special.sel = null; grade(t.key, true);
      const it = special.pairs[t.k].it; speak(it);
      paintMatch();
      if(special.done.length===special.pairs.length){ addXp(3); toast("Tutto fatto!"); }
    } else {
      grade(t.key, false);
      b.classList.add("err");
      special.sel = null;
      setTimeout(()=>paintMatch(), 420);
    }
  });
}

function paintDialogList(){
  if(special.pick) return paintDialog();
  view.innerHTML = `
    <div class="row" style="align-items:center;margin:14px 0 8px">
      <div class="grow"><div style="font-weight:700">Role-play</div>

function paintDialog(){
  const d = DIALOGHI.find(x=>x.id===special.pick);
  view.innerHTML = `

      <div class="grow"><div style="font-weight:700">${esc(d.t)}</div><div class="small">${esc(d.s)}</div></div>

        <button class="bubble" data-rev="${i}" style="text-align:left"><span class="small">${esc(l[2])}</span><br><b style="color:var(--blu)">Tap to check your line</b></button></div>`;
      return `<div class="line ${you?"you":""}"><div class="who">${you?"YOU":"THEM"}</div>
        <div class="bubble"><div class="row"><button class="speak" data-say="${esc(l[1])}">▶</button>

    }).join("")}</div>

    <button class="btn ghost wide" id="revAll" style="margin-top:8px">Reveal every line</button>`;
  $("#back").onclick = ()=>{ special.pick=null; paintDialogList(); };
  view.querySelectorAll("[data-rev]").forEach(b=> b.onclick = ()=>{ special.shown[+b.dataset.rev]=1; addXp(1); paintDialog(); });
  $("#revAll").onclick = ()=>{ d.l.forEach((_,i)=>special.shown[i]=1); paintDialog(); };
  $("#playAll").onclick = ()=>{
    d.l.forEach((_,i)=>special.shown[i]=1); paintDialog();
    if(!window.speechSynthesis) return toast("This browser can't speak Italian");
    speechSynthesis.cancel();
    d.l.forEach(l=>{
      const u = new SpeechSynthesisUtterance(l[1]);
      u.lang="it-IT"; u.rate=S.rate;
      const v = voices.find(v=>v.name===S.voice) || voices[0]; if(v) u.voice=v;
      speechSynthesis.speak(u);
    });
  };
}


/* ============================================================
   TAP A WORD: dictionary lookup, word sheet, study list
   ============================================================ */
function conjugate(inf, fam){
  const stem = inf.slice(0,-3);
  const ends = {are:["o","i","a","iamo","ate","ano"],
                ere:["o","i","e","iamo","ete","ono"],
                ire:["o","i","e","iamo","ite","ono"],
                isc:["isco","isci","isce","iamo","ite","iscono"]}[fam];
  return ends.map(e=>{
    let st = stem;
    if(/(care|gare)$/.test(inf) && /^[ie]/.test(e)) st = st + "h";
    if(st.endsWith("i") && e.startsWith("i")) st = st.slice(0,-1);
    return st + e;
  });
}
const EXTRA = EXTRA_VERBS.map(([i,e,fam])=>({i, e, fam, irr:0, f:conjugate(i,fam), n:"", extra:1}));
const ALLVERBS = VERBS.concat(EXTRA);

const LEX = new Map();
const LEXX = new Map();   /* same words, but keeping their accents */
function addLex(word, entry){
  const k = norm(word).replace(/[^a-z']/g,"");
  if(!k) return;
  const kx = String(word).toLowerCase().replace(/[’]/g,"'").trim();
  if(!LEXX.has(kx)) LEXX.set(kx, []);
  if(!LEXX.get(kx).some(x=>x.kind===entry.kind && x.gloss===entry.gloss && x.v===entry.v && x.p===entry.p))
    LEXX.get(kx).push(entry);
  if(!LEX.has(k)) LEX.set(k, []);
  const list = LEX.get(k);
  if(!list.some(x=>x.kind===entry.kind && x.gloss===entry.gloss && x.v===entry.v && x.p===entry.p)) list.push(entry);
}
(function buildLex(){
  ALLVERBS.forEach(v=>{
    addLex(v.i, {kind:"inf", v, gloss:v.e});
    v.f.forEach((f,p)=> addLex(f, {kind:"form", v, p, gloss:v.e}));
  });
  NOUNS.forEach(n=>{
    const [full, en, g] = n;
    const parts = full.split(" ");
    const word = parts.length>1 ? parts.slice(1).join(" ") : full.replace(/^l'/,"");
    const gg = g==="m" ? "masculine" : "feminine";
    addLex(word, {kind:"noun", gloss:en, note:"a "+gg+" noun — "+full});
    let pl = null;
    if(/o$/.test(word)) pl = word.slice(0,-1)+"i";
    else if(/a$/.test(word)) pl = word.slice(0,-1)+"e";
    else if(/e$/.test(word)) pl = word.slice(0,-1)+"i";
    if(/co$/.test(word)) pl = word.slice(0,-2)+"chi";
    if(/go$/.test(word)) pl = word.slice(0,-2)+"ghi";
    if(/ca$/.test(word)) pl = word.slice(0,-2)+"che";
    if(pl) addLex(pl, {kind:"noun", gloss:en+" (plural)", note:"plural of "+full});
  });
  ADJ.forEach(([a,en])=>{
    addLex(a, {kind:"adj", gloss:en, note:"an adjective — it changes ending to match the noun"});
    if(/o$/.test(a)) ["a","i","e"].forEach(x=> addLex(a.slice(0,-1)+x, {kind:"adj", gloss:en, note:"a form of "+a}));
    else if(/e$/.test(a)) addLex(a.slice(0,-1)+"i", {kind:"adj", gloss:en, note:"plural of "+a});
  });
  FUNC.forEach(([w,en,note])=>{
    const k = norm(w).replace(/[^a-z']/g,"");
    const ex = LEX.get(k);
    /* skip anything the verb, noun and adjective data already covers better */
    if(ex && ex.some(e => e.kind === "inf" ||
        String(e.gloss).split(" ")[0].toLowerCase() === String(en).split(" ")[0].toLowerCase())) return;
    addLex(w, {kind:"word", gloss:en, note:note||""});
  });
})();

const CLITICS = ["glielo","gliela","melo","mela","telo","tela","celo","cela","sene","mi","ti","ci","vi","si","lo","la","li","le","ne"];
const CLIT_EN = {glielo:"it, to him/her/you", gliela:"it, to him/her/you", melo:"it, to me", mela:"it, to me",
  telo:"it, to you", tela:"it, to you", celo:"it, to us", cela:"it, to us", sene:"of it",
  mi:"me", ti:"you", ci:"us / there", vi:"you", si:"oneself", lo:"it / him", la:"it / her",
  li:"them", le:"them / to you", ne:"of it / of them"};
const PART_IRR = {stato:"essere",stati:"essere",stata:"essere",state:"essere",fatto:"fare",detto:"dire",
  preso:"prendere",letto:"leggere",perso:"perdere",persa:"perdere",visto:"vedere",aperto:"aprire",
  chiuso:"chiudere",scelto:"scegliere",bevuto:"bere",piaciuto:"piacere",piaciuta:"piacere",
  conosciuto:"conoscere",venuto:"venire",rimasto:"rimanere",messo:"mettere",scritto:"scrivere",chiesto:"chiedere"};

function lookup(raw){
  const w = norm(raw).replace(/[^a-z']/g,"");
  if(!w) return null;
  /* an exact match including accents wins: e = and, è = he is */
  const wx = String(raw).toLowerCase().replace(/[’]/g,"'").replace(/[^a-zà-ÿ']/g,"").trim();
  if(wx && LEXX.has(wx) && /[àèéìòóùÀ-ÿ]/.test(raw + [...LEXX.keys()].join("")) ) {
    const exact = LEXX.get(wx);
    if(exact && exact.length) return {word:raw, entries:exact};
  }
  if(LEX.has(w)) return {word:raw, entries:LEX.get(w)};
  /* attached pronouns: mostrarmelo, spedirlo, andarci */
  for(const c of CLITICS.slice().sort((a,b)=>b.length-a.length)){
    if(w.length > c.length+2 && w.endsWith(c)){
      const base = w.slice(0, -c.length);
      for(const cand of [base, base+"e"]){
        if(LEX.has(cand)) return {word:raw, entries:LEX.get(cand),
          extra:"With <b>"+esc(c)+"</b> stuck on the end — "+esc(CLIT_EN[c]||c)+"."};
      }
    }
  }
  /* past participles */
  if(PART_IRR[w] && LEX.has(PART_IRR[w]))
    return {word:raw, entries:LEX.get(PART_IRR[w]), extra:"This is the past participle — used for the past tense."};
  const pm = w.match(/^(.*)(at[oaie]|it[oaie]|ut[oaie])$/);
  if(pm){
    for(const inf of [pm[1]+"are", pm[1]+"ire", pm[1]+"ere"]){
      if(LEX.has(inf)) return {word:raw, entries:LEX.get(inf), extra:"Past participle of <b>"+esc(inf)+"</b> — used for the past tense."};
    }
  }
  const gm = w.match(/^(.*)(ando|endo)$/);
  if(gm){
    for(const inf of [gm[1]+"are", gm[1]+"ere", gm[1]+"ire"]){
      if(LEX.has(inf)) return {word:raw, entries:LEX.get(inf), extra:"The <b>-ing</b> form of <b>"+esc(inf)+"</b>. Sto… = I'm doing it right now."};
    }
  }
  /* plural / gender guesses */
  const guesses = [];
  if(/i$/.test(w)) guesses.push(w.slice(0,-1)+"o", w.slice(0,-1)+"e");
  if(/e$/.test(w)) guesses.push(w.slice(0,-1)+"a", w.slice(0,-1)+"o");
  if(/a$/.test(w)) guesses.push(w.slice(0,-1)+"o");
  if(/chi$/.test(w)) guesses.push(w.slice(0,-3)+"co");
  if(/ghi$/.test(w)) guesses.push(w.slice(0,-3)+"go");
  if(/che$/.test(w)) guesses.push(w.slice(0,-3)+"ca");
  for(const g of guesses) if(LEX.has(g))
    return {word:raw, entries:LEX.get(g), extra:"A different ending of <b>"+esc(g)+"</b> — Italian words change ending to match number and gender."};
  return null;
}

/* wrap Italian text so each word can be tapped */
function gloss(text){
  return String(text).replace(/([A-Za-zÀ-ÿ]+['’])|([A-Za-zÀ-ÿ]+)|([^A-Za-zÀ-ÿ]+)/g, (m,a,b,c)=>{
    if(c) return esc(c);
    const w = a||b;
    return '<span class="w" data-w="'+esc(w)+'">'+esc(w)+'</span>';
  });
}

/* ---------- the word sheet ---------- */
function studyKey(w){ return norm(w).replace(/[^a-z']/g,""); }
function inStudy(w){ return !!(S.list && S.list[studyKey(w)]); }
function openWord(raw){
  const res = lookup(raw);
  const k = studyKey(raw);
  let body = "";
  if(!res){
    body = `<p style="margin:0 0 10px">No entry for this one yet. Add it to your word list and look it up when you have a minute.</p>`;
  } else {
    const seen = new Set();
    const ents = res.entries.filter(e=>{
      if(e.kind!=="form" && e.kind!=="inf") return true;
      const k = e.v.i + ":" + e.kind;
      if(seen.has(k)) return false;
      seen.add(k); return true;
    });
    body = ents.map(e=>entryHTML(e, raw)).join("<hr style='border:0;border-top:1px solid var(--line);margin:14px 0'>");
    if(res.extra) body += `<div class="note" style="margin-top:12px">${res.extra}</div>`;
  }
  exprFor(raw).forEach(e => body += exprHTML(e));
  const vf = (res && res.entries.find(e=>e.v)) ? res.entries.find(e=>e.v).v : null;
  const hasOwn = res && res.entries.some(e=>e.kind!=="form" && e.kind!=="inf");
  const ex = hasOwn ? null : exampleFor(raw, vf ? vf.f.concat([vf.i]) : null);
  if(ex) body += `<div style="margin-top:14px">
      <div class="small">In the app</div>
      <div class="row" style="margin-top:4px">
        <button class="speak" data-say="${esc(ex[0])}">▶</button>
        <div class="grow"><div class="it">${gloss(ex[0])}</div><div class="en">${esc(ex[1])}</div></div>
      </div></div>`;
  body += `<div style="margin-top:16px;border-top:1px solid var(--line);padding-top:12px">
      <div style="font-weight:700;font-size:14px">Practise this word</div>
      <p class="small" style="margin:2px 0 8px">Drill it in different sentences until it sticks.</p>
      <div class="row" style="gap:6px">
        ${[10,20,30,50].map(n=>`<button class="btn quiet grow" data-focus="${n}" style="padding:10px 0">${n}</button>`).join("")}
      </div>
    </div>`;
  const sheet = document.createElement("div");
  sheet.className = "sheetbg";
  sheet.innerHTML = `
    <div class="sheet" role="dialog" aria-label="Word meaning">
      <div class="row" style="align-items:center;margin-bottom:8px">
        <button class="speak" data-say="${esc(raw)}">▶</button>
        <div class="grow" style="font-family:var(--serif);font-size:27px;font-weight:700">${esc(raw)}</div>
        <button class="star" id="addWord" aria-pressed="${inStudy(raw)}" title="Add to word list"
          style="font-size:22px">${inStudy(raw) ? "★" : "☆"}</button>
      </div>
      ${body}
      <button class="btn wide" id="closeSheet" style="margin-top:14px">Close</button>
    </div>`;
  document.body.appendChild(sheet);
  const close = ()=> sheet.remove();
  sheet.onclick = e => { if(e.target === sheet) close(); };
  sheet.querySelector("#closeSheet").onclick = close;
  sheet.querySelectorAll("[data-focus]").forEach(b=> b.onclick = ()=>{
    close();
    startFocus(raw, +b.getAttribute("data-focus"));
  });
  sheet.querySelector("#addWord").onclick = (e)=>{
    S.list = S.list || {};
    if(S.list[k]){ delete S.list[k]; toast("Removed from your word list"); }
    else {
      const g = res ? res.entries.map(x=>x.gloss).join(" / ") : "";
      S.list[k] = {w:raw, g, d:today()};
      toast("Added to your word list");
    }
    save();
    const on = inStudy(raw);
    e.currentTarget.setAttribute("aria-pressed", String(on));
    e.currentTarget.textContent = on ? "★" : "☆";
  };
}
function entryHTML(e, raw){
  if(e.kind === "form" || e.kind === "inf"){
    const v = e.v;
    const hit = v.f.map((f,i)=> norm(f)===norm(raw) ? i : -1).filter(i=>i>=0);
    const head = e.kind==="inf"
      ? `<b>${esc(v.i)}</b> = ${esc(v.e)} — this is the infinitive, the dictionary form.`
      : `<b>${esc(v.f[e.p])}</b> = ${esc(PRON[e.p])} form of <b>${esc(v.i)}</b> (${esc(v.e)})`;
    return `
      <div style="font-size:15.5px">${head}</div>
      <div style="margin:6px 0"><span class="pill ${v.irr?"red":"green"}">${famLabel(v)}</span></div>
      <div class="conjlist">${PRON.map((p,i)=>{
        const exs = verbExamples(v,i);
        return `<div class="crow${hit.includes(i)?" hit":""}">
          <div class="row" style="align-items:baseline;gap:8px">
            <span class="pron">${p}</span>
            <span class="form">${hilite(v,i)}</span>
            <span class="eng">= ${esc(engLabel(v,i))}</span>
          </div>
          ${exs.map(ex=>`<div class="ex">
            <button class="speak" data-say="${esc(ex.it)}">▶</button>
            <div class="grow"><div>${gloss(ex.it)}</div><div class="exen">${esc(ex.en)}</div></div>
          </div>`).join("")}
        </div>`;}).join("")}</div>
      ${v.n?`<p class="small" style="margin:6px 0 0">${esc(v.n)}</p>`:""}
      ${hit.length>1?`<p class="small" style="margin:6px 0 0">Careful: this same form is used for ${hit.map(i=>PRON[i]).join(" and ")}. The rest of the sentence tells you which.</p>`:""}`;
  }
  const label = {noun:"noun", adj:"adjective", word:""}[e.kind] || "";
  const ex = exampleFor(raw);
  return `<div style="font-size:15.5px"><b>${esc(raw)}</b> = ${esc(e.gloss)}</div>
    ${e.note?`<p class="small" style="margin:5px 0 0">${esc(e.note)}</p>`:""}
    ${label?`<div style="margin-top:6px"><span class="pill">${label}</span></div>`:""}
    ${ex?`<div class="ex" style="margin-top:8px">
        <button class="speak" data-say="${esc(ex[0])}">▶</button>
        <div class="grow"><div>${gloss(ex[0])}</div><div class="exen">${esc(ex[1])}</div></div>
      </div>`:""}`;
}
function engPerson(i, inf){
  let base = String(inf).replace(/^to /,"").split(" / ")[0].split(" (")[0].trim();
  const words = base.split(" ");
  const first = words[0], rest = words.slice(1).join(" ");
  const tail = rest ? " " + rest : "";
  if(first === "be")   return ["I am","you are","he / she is","we are","you are","they are"][i] + tail;
  if(first === "have") return ["I have","you have","he / she has","we have","you have","they have"][i] + tail;
  if(["can","must","may","should","will"].includes(first)) return ["I","you","he / she","we","you","they"][i] + " " + base;
  const third = /([sxz]|ch|sh)$/.test(first) ? first+"es"
              : /[^aeiou]y$/.test(first) ? first.slice(0,-1)+"ies"
              : first+"s";
  return ["I "+base, "you "+base, "he / she "+third+tail, "we "+base, "you "+base, "they "+base][i];
}

const SUBJ = ["Io","Tu","Lui","Noi","Voi","Loro"];
function buildEx(v, i, e){
  let en = engPerson(i, e[2] ? "to " + e[2] : v.e).replace(/^he \/ she /, "He ") + " " + e[1] + ".";
  en = en[0].toUpperCase() + en.slice(1);
  return {it: SUBJ[i] + " " + v.f[i] + " " + e[0] + ".", en};
}
function verbExample(v, i){
  if(VEXF[v.i]) return VEXF[v.i][i] ? {it:VEXF[v.i][i][0], en:VEXF[v.i][i][1]} : null;
  return VEX[v.i] ? buildEx(v, i, VEX[v.i]) : null;
}
/* one example per sense of the verb */
function engLabel(v, i){
  const s1 = VEX[v.i] && VEX[v.i][2] ? "to " + VEX[v.i][2] : v.e;
  let out = engPerson(i, s1);
  if(VEX2[v.i] && !VEXF[v.i]){
    const s2 = engPerson(i, "to " + VEX2[v.i][2]).replace(/^(I|you|he \/ she|we|they)\s+/, "");
    if(!out.endsWith(s2)) out += " / " + s2;
  }
  return out;
}
function verbExamples(v, i){
  const out = [];
  const first = verbExample(v, i);
  if(first) out.push(first);
  if(VEX2[v.i] && !VEXF[v.i]) out.push(buildEx(v, i, VEX2[v.i]));
  return out;
}

/* ============================================================
   VIEW: Saved — word list and notes
   ============================================================ */
function renderSaved(){
  if(S.sheetOpen) return renderSheet();
  S.list = S.list || {}; S.notes = S.notes || [];
  const words = Object.entries(S.list).sort((a,b)=> a[1].w.localeCompare(b[1].w));
  const notes = S.notes.slice().sort((a,b)=> b.id - a.id);
  view.innerHTML = `
    <h1>Saved</h1>
    <p class="lede">Words you tapped and kept, and anything you wrote down while using the app. Both live on this device.</p>

    <h2>My phrases</h2>
    <p class="small" style="margin:0 0 8px">A phrasebook written from your own answers — who you are, who you're with, what you like.</p>
    <div id="mineBox"></div>

    <h2>Word list <span class="count">${words.length}</span></h2>
    ${words.length ? `
      <div class="card">${words.map(([k,v])=>`
        <div class="phrase">
          <div class="row">
            <button class="speak" data-say="${esc(v.w)}">▶</button>
            <div class="grow"><div class="it"><span class="w" data-w="${esc(v.w)}">${esc(v.w)}</span></div>
              <div class="en">${esc(v.g||"tap the word for the meaning")}</div></div>
            <button class="star" aria-pressed="true" data-drop="${esc(k)}" title="Remove">★</button>
          </div>
        </div>`).join("")}</div>
      <button class="btn wide" id="drillWords" style="margin-top:8px">Practise these words</button>
      <button class="btn ghost wide" id="clearWords" style="margin-top:8px">Empty the word list</button>`
    : `<div class="card"><p style="margin:0">Empty so far. Tap any Italian word anywhere in the app, then tap the star in the pop-up to keep it here.</p></div>`}

    <h2>Notes <span class="count">${notes.length}</span></h2>
    <div class="card">
      <textarea id="newNote" class="notebox" rows="3" placeholder="Something a waiter said, a word you keep forgetting, a place someone recommended…"></textarea>
      <button class="btn wide" id="saveNote" style="margin-top:8px">Save note</button>
    </div>
    ${notes.map(n=>`
      <div class="card tight" data-note="${n.id}">
        <div class="row" style="align-items:baseline">
          <div class="small grow">${esc(n.d)}</div>
          <button class="btn quiet" data-edit="${n.id}" style="padding:6px 10px;font-size:13px">Edit</button>
          <button class="btn quiet" data-del="${n.id}" style="padding:6px 10px;font-size:13px;margin-left:6px">Delete</button>
        </div>
        <div class="notetext">${esc(n.t).replace(/\n/g,"<br>")}</div>
      </div>`).join("")}
    ${notes.length ? `
      <div class="row" style="gap:8px;margin-top:10px">
        <button class="btn ghost grow" id="copyNotes">Copy all notes</button>
        <button class="btn ghost grow" id="dlNotes">Download</button>
      </div>
      <p class="small" style="margin-top:6px">Tap any word above to see it again, or to drill just that word.</p>
      <div class="row" style="gap:8px;margin-top:8px">
        <button class="btn ghost grow" id="impProfile">Load a saved export</button>
      </div>
      <input type="file" id="impFile" accept="application/json,.json" class="hidden">
      <p class="small" style="margin-top:8px">Notes are kept in this browser only. Copy or download them now and then so you don't lose them.</p>` : ""}
  `;
  renderMyPhrases($("#mineBox"));
  view.querySelectorAll("[data-drop]").forEach(b=> b.onclick = ()=>{
    delete S.list[b.getAttribute("data-drop")]; save(); renderSaved();
  });
  if($("#drillWords")) $("#drillWords").onclick = ()=>{
    if(Object.keys(S.list).length < 3) return toast("Save at least three words first");
    go("drills"); startDrill("flash","study");
  };
  if($("#clearWords")) $("#clearWords").onclick = ()=>{
    if(confirm("Remove every word from the list?")){ S.list = {}; save(); renderSaved(); }
  };
  const box = $("#newNote");
  if(S.draft) box.value = S.draft;
  box.oninput = ()=>{ S.draft = box.value; save(); };
  $("#saveNote").onclick = ()=>{
    const t = box.value.trim();
    if(!t) return toast("Nothing to save yet");
    S.notes.push({id:Date.now(), t, d:new Date().toLocaleDateString()});
    S.draft = ""; save(); renderSaved(); toast("Note saved");
  };
  view.querySelectorAll("[data-del]").forEach(b=> b.onclick = ()=>{
    if(!confirm("Delete this note?")) return;
    S.notes = S.notes.filter(n=> n.id !== +b.getAttribute("data-del")); save(); renderSaved();
  });
  view.querySelectorAll("[data-edit]").forEach(b=> b.onclick = ()=>{
    const id = +b.getAttribute("data-edit");
    const card = view.querySelector(`[data-note="${id}"]`);
    const n = S.notes.find(x=>x.id===id);
    card.querySelector(".notetext").innerHTML =
      `<textarea class="notebox" rows="4">${esc(n.t)}</textarea>
       <button class="btn wide" style="margin-top:8px">Save changes</button>`;
    const ta = card.querySelector("textarea");
    ta.focus();
    card.querySelector("button.btn.wide").onclick = ()=>{ n.t = ta.value; save(); renderSaved(); toast("Note updated"); };
  });
  if($("#impProfile")){
    $("#impProfile").onclick = ()=> $("#impFile").click();
    $("#impFile").onchange = (e)=>{ if(e.target.files[0]) importProfile(e.target.files[0]); };
  }
  const asText = ()=> S.notes.slice().sort((a,b)=>a.id-b.id).map(n=>n.d+"\n"+n.t).join("\n\n———\n\n");
  if($("#copyNotes")) $("#copyNotes").onclick = async ()=>{
    try{ await navigator.clipboard.writeText(asText()); toast("Copied"); }
    catch(e){ toast("Select and copy by hand — this browser blocked it"); }
  };
  if($("#dlNotes")) $("#dlNotes").onclick = ()=>{
    try{
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([asText()], {type:"text/plain"}));
      a.download = "andiamo-notes.txt"; a.click(); URL.revokeObjectURL(a.href);
    }catch(e){ toast("Download blocked here — use Copy all notes"); }
  };
}

function exprFor(word){
  const k = norm(word).replace(/[^a-z']/g,"");
  return EXPR.filter(e => e.keys.some(x => norm(x) === k));
}
function exprForms(e){
  if(e.forms) return e.forms;
  const v = ALLVERBS.find(x => x.i === e.v);
  return v.f.map((f,i)=> [f + e.tail, e.enf[i]]);
}
function exprHTML(e){
  return `<div class="note gold" style="margin-top:14px">
    <div style="font-weight:700;margin-bottom:2px">${esc(e.it)} — ${esc(e.en)}</div>
    <table class="conj">${exprForms(e).map(([it,en])=>`
      <tr><td style="width:46%;color:var(--ink);font-weight:600">${gloss(it)}</td>
      <td style="font-weight:400;color:var(--muted)">${esc(en)}</td></tr>`).join("")}</table>
    ${e.n?`<p class="small" style="margin:6px 0 0">${esc(e.n)}</p>`:""}
  </div>`;
}

/* ---------- an example sentence from the app, for any word ---------- */
const EXAMPLES = (function(){
  const idx = new Map();
  const add = (it, en) => {
    it.split(/([A-Za-zÀ-ÿ]+['’])|([A-Za-zÀ-ÿ]+)/).filter(x=>x && /[A-Za-zÀ-ÿ]/.test(x)).forEach(tok=>{
      const k = norm(tok).replace(/[^a-z']/g,"");
      if(k && !idx.has(k)) idx.set(k, [it, en]);
    });
  };
  ALLPHRASES.forEach(p => add(p.it, p.en));
  QA.forEach(q => { add(q[0], q[1]); add(q[2], q[3]); });
  DIALOGHI.forEach(d => d.l.forEach(l => add(l[1], l[2])));
  STORIES.forEach(st => st.l.forEach(l => add(l[0], l[1])));
  return idx;
})();

const EXK = new Map(Object.entries(EX_EXTRA).map(([k,v])=>[norm(k).replace(/[^a-z']/g,""), v]));

/* a sentence built from the word's own entry, when nothing else exists */
function autoExample(word){
  const k = norm(word).replace(/[^a-z']/g,"");
  const noun = NOUNS.find(x => norm(x[0].replace(/^(il|lo|la|i|le|gli|l')\s?/,"")) === k);
  if(noun){
    const [full, en, g, theme] = noun;
    const bare = full.replace(/^(il|lo|la|l')\s?/,"");
    const indef = g==="m" ? (/^(s[^aeiou]|z|gn|ps|x)/i.test(bare) ? "uno " : "un ")
                          : (/^[aeiou]/i.test(bare) ? "un'" : "una ");
    if(["strada","arte","trasporti","orari","aiuto","consigli"].includes(theme))
      return {it:`Dov'è ${full}, per favore?`, en:`Where is the ${en}, please?`};
    if(["caffe","ristorante","vino","birra","salumi","soldi","misure"].includes(theme))
      return {it:`Vorrei ${indef}${bare}, grazie.`, en:`I'd like a ${en}, thanks.`};
    return {it:`Mi piace molto ${full}.`, en:`I really like the ${en}.`};
  }
  const adj = ADJ.find(a => norm(a[0]) === k ||
    (a[0].endsWith("o") && ["a","i","e"].some(x=>norm(a[0].slice(0,-1)+x)===k)));
  if(adj){
    const base = adj[0], f = base.endsWith("o") ? base.slice(0,-1)+"a" : base;
    return {it:`Questo vino è molto ${base}.`, en:`This wine is very ${adj[1]}.`,
            alt:`Questa birra è molto ${f}.`};
  }
  return null;
}
function exampleFor(word, forms){
  const k0 = norm(word).replace(/[^a-z']/g,"");
  if(EXK.has(k0)) return EXK.get(k0);
  const tries = [word].concat(forms||[]);
  for(const t of tries){
    const k = norm(t).replace(/[^a-z']/g,"");
    if(EXAMPLES.has(k)) return EXAMPLES.get(k);
    if(EXK.has(k)) return EXK.get(k);
  }
  const auto = autoExample(word);
  return auto ? [auto.it, auto.en] : null;
}


/* ============================================================
   Search that reads whole phrases, not just single words
   ============================================================ */
function tokensOf(q){
  return String(q).split(/([A-Za-zÀ-ÿ]+['’])|([A-Za-zÀ-ÿ]+)/)
    .filter(x => x && /[A-Za-zÀ-ÿ]/.test(x));
}
function primaryGloss(e){
  if(e.kind === "form") return engPerson(e.p, e.v.e).replace(/^he \/ she /, "he/she ");
  return String(e.gloss);
}
function wordBreakdown(q){
  return tokensOf(q).map(t => {
    const r = lookup(t);
    return {t, entries: r ? r.entries : [], extra: r && r.extra};
  });
}
/* sentences in the app that contain the whole phrase */
function phraseMatches(q){
  const needle = norm(q);
  if(needle.length < 3) return [];
  return SENTENCES.filter(([it,en]) => en && norm(it).includes(needle)).slice(0,3);
}
const CLITIC_SENSE = {gli:"to him", le:"to her", mi:"to me", ti:"to you", ci:"to us",
  vi:"to you", ne:"of it", lo:"it", la:"it", li:"them"};
function editDistance(a,b){
  const m=a.length, n=b.length;
  if(Math.abs(m-n)>2) return 9;
  let prev=Array.from({length:n+1},(_,j)=>j), cur=new Array(n+1);
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++)
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    [prev,cur]=[cur,prev];
  }
  return prev[n];
}
function didYouMean(word){
  const w = norm(word).replace(/[^a-z']/g,"");
  if(w.length < 3) return [];
  const out = [];
  for(const k of LEX.keys()){
    if(Math.abs(k.length - w.length) > 2) continue;
    const d = editDistance(w, k);
    if(d <= 2) out.push({k, d});
  }
  /* also try the word with a pronoun peeled off: prederne -> predere -> prendere */
  for(const c of CLITICS){
    if(w.length > c.length + 3 && w.endsWith(c)){
      const stem = w.slice(0, -c.length);
      for(const k of LEX.keys()){
        if(Math.abs(k.length - stem.length) > 2 || k.length < 4) continue;
        if(!LEX.get(k).some(e=>e.kind==="inf")) continue;
        const d = editDistance(stem, k) - 0.5;
        if(d <= 2) out.push({k, d, c});
      }
    }
  }
  out.sort((a,b)=>a.d-b.d);
  const seen = new Set();
  return out.filter(o => !seen.has(o.k) && seen.add(o.k)).slice(0,3);
}
function breakdownHTML(q){
  const parts = wordBreakdown(q);
  if(!parts.length) return "";
  const known = parts.filter(p => p.entries.length);
  const rough = parts.map((p,i) => {
    if(!p.entries.length) return "…";
    const k = norm(p.t).replace(/[^a-z']/g,"");
    const next = parts[i+1];
    if(CLITIC_SENSE[k] && next && next.entries.some(e=>e.kind==="form")) return CLITIC_SENSE[k];
    return primaryGloss(p.entries[0]).split(" / ")[0];
  }).join(" ");
  const hits = phraseMatches(q);
  const multi = parts.length > 1 && known.length > 0;
  return `
    <div class="card" style="border-color:var(--blu);border-width:1.5px">
      <div class="row" style="align-items:center">
        <button class="speak" data-say="${esc(q)}">▶</button>
        <div class="grow" style="font-family:var(--serif);font-size:20px;font-weight:700">${esc(q)}</div>
      </div>
      ${multi ? `<div style="margin-top:10px"><span class="pill">Word by word</span>
        <div style="font-size:16px;margin-top:5px">${esc(rough)}</div>
        <p class="small" style="margin:4px 0 0">Rough and literal — Italian rarely lines up one word to one word. The real sense is usually in the sentence below.</p>
      </div>` : ""}
      ${hits.length ? `<div style="margin-top:12px">
        <span class="pill green">${multi?"Found in the app":"In the app"}</span>
        ${hits.map(([it,en])=>`<div class="ex" style="margin-top:7px">
          <button class="speak" data-say="${esc(it.replace(/[«»]/g,""))}">▶</button>
          <div class="grow"><div>${gloss(it)}</div><div class="exen">${esc(en)}</div></div>
        </div>`).join("")}
      </div>` : ""}
      <div style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px">
        <span class="pill">Each word</span>
        ${parts.map(p => {
          if(!p.entries.length){
            const near = didYouMean(p.t);
            return `<div class="phrase"><div class="it">${esc(p.t)}</div>
              <div class="en">No entry spelled that way.${near.length?" Did you mean:":""}</div>
              ${near.length?`<div class="chips" style="margin:6px 0 0">${near.map(o=>{
                 const ent = LEX.get(o.k)[0];
                 const g = primaryGloss(ent).split(" / ")[0];
                 return `<button class="chip" data-open="${esc(o.k)}">${esc(o.k)}${o.c?" + "+esc(o.c):""} — ${esc(g)}</button>`;
               }).join("")}</div>`:""}</div>`;
          }
          const glosses = [...new Set(p.entries.map(primaryGloss))].join(" · ");
          const vb = p.entries.find(e=>e.v);
          return `<div class="phrase"><div class="row" style="align-items:center">
            <button class="speak" data-say="${esc(p.t)}">▶</button>
            <button class="grow" data-open="${esc(p.t)}" style="background:none;border:0;text-align:left;padding:0">
              <div class="it">${esc(p.t)}</div>
              <div class="en">${esc(glosses)}${vb?` — from ${esc(vb.v.i)}`:""}</div>
              ${p.extra?`<div class="small" style="color:var(--blu);margin-top:2px">${p.extra}</div>`:""}
            </button>
          </div></div>`;
        }).join("")}
      </div>
      <p class="small" style="margin:10px 0 0">Tap any word above for the full entry.</p>
    </div>`;
}

let dictDir = "it", dictType = "all", dictQ = "";
function dictEntries(){
  const out = [];
  ALLVERBS.forEach(v => out.push({it:v.i, en:v.e, type:"verb", sub:famLabel(v), v}));
  NOUNS.forEach(([full,en,g]) => out.push({it:full, en, type:"noun", sub:(g==="m"?"masculine":"feminine"), look:full.replace(/^(il|lo|la|i|le|gli|l')\s?/,"")}));
  ADJ.forEach(([a,en]) => out.push({it:a, en, type:"adj", sub:"adjective"}));
  const seen = new Set(out.map(o => norm(o.look||o.it)));
  FUNC.forEach(([w,en,note]) => {
    const k = norm(w);
    if(seen.has(k) || /English word in the prompt/.test(en)) return;
    seen.add(k);
    out.push({it:w, en, type:"word", sub:note||""});
  });
  return out;
}
const DICT = null;

function fillTemplate(itT, enT){
  const picks = {};
  const it = itT.replace(/\{(\w+)\}/g, (m,k)=>{
    if(!SLOT[k]) return m;
    if(!picks[k]) picks[k] = SLOT[k][Math.random()*SLOT[k].length|0];
    return picks[k][0];
  });
  const en = enT.replace(/\{(\w+)\}/g, (m,k)=> picks[k] ? picks[k][1] : m);
  return {it, en};
}

/* every app sentence that contains the word */
const SENTENCES = (function(){
  const out = [];
  ALLPHRASES.forEach(p => out.push([p.it, p.en]));
  QA.forEach(q => { out.push([q[0], q[1]]); out.push([q[2], q[3]]); });
  DIALOGHI.forEach(d => d.l.forEach(l => out.push([l[1], l[2]])));
  STORIES.forEach(st => st.l.forEach(l => out.push([l[0], l[1]])));
  PAIRS.forEach(pr => pr.items.forEach(i => out.push([i[0].replace("___", i[1]), ""])));
  return out;
})();
function sentencesWith(forms){
  const keys = forms.map(f => norm(f).replace(/[^a-z']/g,""));
  return SENTENCES.filter(([it]) =>
    it.split(/([A-Za-zÀ-ÿ]+['’])|([A-Za-zÀ-ÿ]+)/).filter(x=>x&&/[A-Za-zÀ-ÿ]/.test(x))
      .some(tok => keys.includes(norm(tok).replace(/[^a-z']/g,"")))
  ).map(([it,en]) => ({it, en:en||""}));
}

/* build a pool of sentences for one word */
function focusPool(word, n){
  const k = norm(word).replace(/[^a-z']/g,"");
  const res = lookup(word);
  const v = res && res.entries.find(e=>e.v) ? res.entries.find(e=>e.v).v : null;
  const forms = v ? v.f.concat([v.i]) : [word];
  const pool = [], seen = new Set();
  const push = o => { const key = norm(o.it); if(o.en && !seen.has(key)){ seen.add(key); pool.push(o); } };

  sentencesWith(forms).forEach(push);
  const tpl = FOCUS[k] || (v ? FOCUS[norm(v.i)] : null);
  if(tpl){
    let guard = 0;
    while(pool.length < n*1.5 && guard++ < n*12){
      const t = tpl[Math.random()*tpl.length|0];
      push(fillTemplate(t[0], t[1]));
    }
  }
  /* nouns and adjectives get sentences built from their own entry */
  if(!tpl && res){
    const noun = NOUNS.find(x => norm(x[0].replace(/^(il|lo|la|i|le|gli|l')\s?/,"")) === k);
    if(noun){
      const full = noun[0], en = noun[1], g = noun[2];
      const bare = full.replace(/^(il|lo|la|l')\s?/,"");
      const indef = g==="m" ? (/^(s[^aeiou]|z|gn|ps|x)/i.test(bare) ? "uno " : "un ")
                            : (/^[aeiou]/i.test(bare) ? "un'" : "una ");
      const theme = noun[3];
      const buyable = ["caffe","ristorante","vino","birra","salumi","soldi","misure"].includes(theme);
      const place   = ["strada","arte","trasporti","orari","aiuto","consigli"].includes(theme);
      const lines = [[`Mi piace molto ${full}.`, `I really like the ${en}.`],
                     [`Scusi, cerco ${full}.`, `Excuse me, I'm looking for the ${en}.`],
                     [`Com'è ${full} qui?`, `What's the ${en} like here?`]];
      if(buyable) lines.push([`Vorrei ${indef}${bare}, grazie.`, `I'd like a ${en}, thanks.`],
                             [`Quanto costa ${full}?`, `How much is the ${en}?`],
                             [`Avete ${indef}${bare}?`, `Do you have a ${en}?`]);
      if(place)   lines.push([`Dov'è ${full}, per favore?`, `Where is the ${en}, please?`],
                             [`C'è ${indef}${bare} qui vicino?`, `Is there a ${en} nearby?`],
                             [`Quanto è lontano ${full}?`, `How far is the ${en}?`]);
      lines.forEach(([it,en2])=>push({it,en:en2}));
    }
    const adj = ADJ.find(a => norm(a[0]) === k || (a[0].endsWith("o") && [ "a","i","e" ].some(x=>norm(a[0].slice(0,-1)+x)===k)));
    if(adj){
      const [base, en] = adj;
      const m = base, f = base.endsWith("o") ? base.slice(0,-1)+"a" : base;
      const mp = base.endsWith("o") ? base.slice(0,-1)+"i" : base.slice(0,-1)+"i";
      [[`Questo vino è molto ${m}.`, `This wine is very ${en}.`],
       [`Questa birra è troppo ${f}.`, `This beer is too ${en}.`],
       [`Cerco qualcosa di ${m}.`, `I'm looking for something ${en}.`],
       [`Non è ${m}, è il contrario.`, `It isn't ${en}, it's the opposite.`],
       [`Avete dei formaggi ${mp}?`, `Do you have any ${en} cheeses?`]].forEach(([it,en2])=>push({it,en:en2}));
    }
  }
  return {pool, verb:v};
}

/* build and start the session */
function startFocus(word, n){
  const {pool, verb} = focusPool(word, n);
  if(!pool.length && !verb){ toast("Not enough material for that word yet"); return; }
  const steps = [];
  const key = i => "f:" + norm(word) + ":" + i;
  const kinds = ["cloze","quiz","listen","build"];
  let i = 0, guard = 0;
  const bag = shuffle(pool);
  while(steps.length < n && guard++ < n*6){
    if(verb && steps.length % 4 === 3){
      steps.push({kind:"conj", v:verb, p:Math.random()*6|0});
      continue;
    }
    if(!bag.length){ if(!pool.length) break; bag.push(...shuffle(pool)); }
    const s = bag.pop();
    const item = {it:s.it, en:s.en, ph:"", key:key(i++)};
    const kind = kinds[steps.length % kinds.length];
    if(kind === "cloze"){
      const toks = item.it.split(" ");
      const wordsIn = toks.map((t,ix)=>({t, ix})).filter(o => {
        const c = norm(o.t).replace(/[^a-z']/g,"");
        const target = norm(word).replace(/[^a-z']/g,"");
        return c === target || (verb && verb.f.concat([verb.i]).some(f=>norm(f)===c));
      });
      const pick = wordsIn.length ? wordsIn[0] : {t:toks[0], ix:0};
      const bare = pick.t.replace(/[^A-Za-zÀ-ÿ']/g,"");
      const shown = toks.map((t,ix)=> ix===pick.ix ? t.replace(bare,"_____") : t).join(" ");
      const others = verb ? verb.f.filter(f=>norm(f)!==norm(bare))
                          : [...new Set(pool.flatMap(p=>p.it.split(" ").map(x=>x.replace(/[^A-Za-zÀ-ÿ']/g,""))))]
                              .filter(x=>x.length>2 && norm(x)!==norm(bare));
      steps.push({kind:"cloze", it:item, shown, ans:bare, opts:shuffle([bare].concat(sample(others,3)))});
    } else if(kind === "build" && item.it.split(" ").length >= 4 && item.it.split(" ").length <= 8){
      steps.push({kind:"build", it:item, toks:shuffle(item.it.split(" "))});
    } else {
      const distract = sample(pool.filter(p=>p.it!==item.it).concat(ALLPHRASES), 3)
        .map(p=>({it:p.it, en:p.en, key:"d:"+norm(p.it).slice(0,10)}));
      steps.push({kind:"quiz", it:item, opts:shuffle([item].concat(distract)),
                  dir: kind === "listen" ? "listen" : (Math.random()<.5 ? "it2en" : "en2it")});
    }
  }
  sess = {type:"focus", focusWord:word, title:"Focus: " + word, steps:shuffle(steps), i:0, right:0, wrong:0, state:{}};
  special = null;
  go("drills");
}

function speakLines(lines){
  if(!window.speechSynthesis) return toast("This browser can't speak Italian");
  speechSynthesis.cancel();
  lines.forEach(t=>{
    const u = new SpeechSynthesisUtterance(t.replace(/[«»]/g,""));
    u.lang = "it-IT"; u.rate = S.rate;
    const v = voices.find(v=>v.name===S.voice) || voices[0]; if(v) u.voice = v;
    speechSynthesis.speak(u);
  });
}

  const i = special.i, l = st.l[i], last = i >= st.l.length-1;
  host.innerHTML = `

}

function storyQuiz(st, host){
  const i = special.i, q = st.q[i];
  if(i >= st.q.length){
    const got = special.score || 0;
    host.innerHTML = `
      <h1 style="margin-top:20px">${got} / ${st.q.length}</h1>
      <p class="lede">${got === st.q.length ? "Every one." : "Read the explanations again — that's where the grammar sits."}</p>
      <button class="btn wide" id="againQ">Try the gaps again</button>
      <button class="btn ghost wide" id="other" style="margin-top:8px">Another version of the story</button>`;
    $("#againQ").onclick = ()=>{ special.i = 0; special.score = 0; special.shown = {}; paintStory(); };
    $("#other").onclick = ()=>{ special.pick = null; paintStoryList(); };
    return;
  }
  const opts = shuffle(q.o);
  host.innerHTML = `
    <div class="bar"><i style="width:${i/st.q.length*100}%"></i></div>
    <div class="card">
      <div class="small">Fill the gap — question ${i+1} of ${st.q.length}</div>
      <div style="font-family:var(--serif);font-size:21px;font-weight:700;margin-top:6px">${gloss(q.s)}</div>
    </div>
    ${opts.map((o,ix)=>`<button class="opt" data-ix="${ix}">${esc(o.w)}</button>`).join("")}`;
  host.querySelectorAll(".opt").forEach(b=> b.onclick = ()=>{
    const chosen = opts[+b.dataset.ix];
    const ok = !!chosen.ok;
    host.querySelectorAll(".opt").forEach((x,ix)=>{
      x.disabled = true;
      if(opts[ix].ok) x.classList.add("correct");
      else if(x===b) x.classList.add("wrong"); else x.classList.add("dim");
    });
    special.score = (special.score||0) + (ok?1:0);
    grade("sq:"+st.id+":"+i, ok);
    const right = q.o.find(o=>o.ok);
    const full = q.s.replace("___", right.w);
    let html = `<b>${gloss(full)}</b><br><b>${esc(right.w)}</b> — ${esc(right.why)}`;
    if(!ok) html += `<br><br>You chose <b>${esc(chosen.w)}</b>. ${esc(chosen.why)}`;
    html += `<button class="speak" style="margin-top:8px" data-say="${esc(full.replace(/[«»]/g,""))}">▶</button>`;
    const fb = document.createElement("div");
    fb.className = "fb " + (ok?"ok":"no");
    fb.innerHTML = html;
    host.appendChild(fb);
    const btn = document.createElement("button");
    btn.className = "btn wide"; btn.style.marginTop = "6px";
    btn.textContent = i+1 >= st.q.length ? "See the score" : "Next gap";
    btn.onclick = ()=>{ special.i = i+1; paintStory(); };
    host.appendChild(btn);
    scrollSafe(btn);
  });
}
